    <style>
        :root {
            --bg-main: #f5f5f2;
            --bg-sec: #ecece7;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #4b4b4b;
            --border-color: #000000;
            --accent-1: #f4ff00;
            --border: 2px solid var(--border-color);
            --font-head: 'Bebas Neue', sans-serif;
            --font-body: 'IBM Plex Mono', monospace;
        }

        [data-theme="dark"] {
            --bg-main: #0a0a0a;
            --bg-sec: #141414;
            --card-bg: #000000;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: var(--font-body); transition: background-color 0.3s; }

        /* --- BOOK TABLE SYSTEM --- */
        .edu-book-viewport {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 140px 0 100px 0;
            perspective: 3500px;
            border-top: var(--border);
            border-bottom: var(--border);
            
            /* Light Mode Table */
            background-color: #eaddd0;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.5) 0%, transparent 70%),
                repeating-linear-gradient(to right, transparent, transparent 2px, rgba(0,0,0,0.012) 2px, rgba(0,0,0,0.02) 4px),
                linear-gradient(to bottom, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.05) 100%);
        }

        [data-theme="dark"] .edu-book-viewport {
            /* Dark Mode Table */
            background-color: #171412;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.05) 0%, transparent 70%),
                repeating-linear-gradient(to right, transparent, transparent 2px, rgba(255,255,255,0.01) 2px, rgba(255,255,255,0.015) 4px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.4) 100%);
        }

        .book-container {
            position: relative;
            width: 980px;
            height: 640px;
            transform-style: preserve-3d;
            transform: rotateX(20deg) rotateY(-8deg);
            transition: transform 1.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .book-base-shadows {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 6px;
            transform: translateZ(-35px) scale(0.98);
            background: rgba(40, 25, 15, 0.15);
            filter: blur(25px);
            pointer-events: none;
            box-shadow: 0 30px 60px rgba(0,0,0,0.08), 0 15px 25px rgba(0,0,0,0.05);
        }

        /* --- THE CLICK ZONES (FIXED) --- */
        .click-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%;
            z-index: 1000;
            cursor: pointer;
            /* Critical: Pull out of the 3D stack so they are always clickable */
            transform: translateZ(80px);
        }
        .click-zone-left { left: 0; }
        .click-zone-right { right: 0; }

        /* --- PAGE LOGIC --- */
        .book-pages-wrapper { position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; }
        .sheet {
            position: absolute;
            width: 50%; height: 100%;
            right: 0; top: 0;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 1.4s cubic-bezier(0.45, 0.05, 0.15, 1);
            z-index: 1;
        }

        .page-side {
            position: absolute; width: 100%; height: 100%;
            background: #faf9f5;
            padding: 75px 70px;
            backface-visibility: hidden;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .page-side.front { transform: rotateY(0deg) translateZ(1px); }
        .page-side.back { transform: rotateY(180deg) translateZ(-1px); }
        
        .sheet.flipped { transform: rotateY(-180deg); }

        /* Add the rest of your styles here, maintaining the structure... */
    </style>
</head>

<body>
    <section id="education">
        <div class="edu-book-viewport">

                <div class="book-base-shadows"></div>
                <div class="click-zone click-zone-left" id="zone-left"></div>
                <div class="click-zone click-zone-right" id="zone-right"></div>
                
                <div class="book-pages-wrapper">
                    </div>
            </div>
        </div>
    </section>
