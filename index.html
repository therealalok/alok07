<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alok OS — Premium Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
:root {
  --bg-dark: #050505;
  --text-main: #ffffff;
  --text-muted: #888888;
  --accent: #0078D4;
  
  --glass-bg: rgba(20, 20, 20, 0.4);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-hover: rgba(255, 255, 255, 0.12);
  
  --shadow-float: 0 20px 40px rgba(0,0,0,0.5);
  
  --radius-lg: 16px;
  --radius-md: 12px;
  
  --anim-smooth: 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
}

* { margin:0; padding:0; box-sizing:border-box; user-select: none; font-family: 'Inter', sans-serif; }
html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg-dark); color: var(--text-main); }
button { outline: none; border: none; background: none; color: inherit; cursor: pointer; }

/* Dynamic Football/Minimal Wallpaper */
#wallpaper {
  position: fixed; inset: 0; z-index: 0;
  background: url('https://images.unsplash.com/photo-1518605368461-1e1e38ce8a31?q=80&w=2560') center/cover;
  filter: brightness(0.4) contrast(1.1);
  transition: all 1s ease;
}

/* Premium Desktop with Large Folder Cards */
#desktop {
  position: absolute; inset: 0; bottom: 80px; z-index: 10;
  display: flex; gap: 40px; padding: 60px;
  align-content: flex-start; flex-wrap: wrap;
}

.desktop-card {
  width: 140px; height: 160px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  border-radius: var(--radius-lg);
  cursor: pointer; position: relative; overflow: hidden;
  transition: var(--anim-smooth);
}

.desktop-card .card-bg {
  position: absolute; inset: 0; z-index: -1;
  background-size: cover; background-position: center;
  border-radius: var(--radius-lg);
  border: 1px solid var(--glass-border);
  opacity: 0.7; transition: var(--anim-smooth);
}

.desktop-card:hover { transform: translateY(-5px); }
.desktop-card:hover .card-bg { opacity: 1; border-color: rgba(255,255,255,0.3); box-shadow: var(--shadow-float); }
.desktop-card.selected .card-bg { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

.desktop-card span {
  font-size: 13px; font-weight: 500;
  padding: 12px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  background: linear-gradient(transparent, rgba(0,0,0,0.9));
  width: 100%; text-align: center;
}

/* Floating Taskbar */
#taskbar {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  height: 56px; z-index: 1000;
  background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  border: 1px solid var(--glass-border); border-radius: 28px;
  display: flex; align-items: center; padding: 0 16px; gap: 12px;
  box-shadow: var(--shadow-float);
}

.tb-icon {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; transition: var(--anim-smooth);
  color: var(--text-main); position: relative;
}
.tb-icon:hover { background: var(--glass-hover); transform: scale(1.1); }
.tb-icon.active::after {
  content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
  width: 6px; height: 6px; background: var(--text-main); border-radius: 50%;
}

/* Windows System */
#windows-layer { position: absolute; inset: 0; z-index: 20; pointer-events: none; }

.os-window {
  position: absolute; top: 15%; left: 20%; width: 900px; height: 600px;
  background: rgba(10, 10, 10, 0.75); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--glass-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-float);
  display: flex; flex-direction: column; overflow: hidden; pointer-events: auto;
  opacity: 0; transform: scale(0.9) translateY(20px);
  transition: opacity 0.2s cubic-bezier(0.2,0.8,0.2,1), transform 0.2s cubic-bezier(0.2,0.8,0.2,1);
}
.os-window.active { opacity: 1; transform: scale(1) translateY(0); }
.os-window.maximized { top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; }
.os-window.focus { z-index: 100; border-color: rgba(255,255,255,0.2); }

.win-header {
  height: 48px; display: flex; justify-content: space-between; align-items: center;
  padding: 0 20px; border-bottom: 1px solid var(--glass-border); flex-shrink: 0;
}
.win-header.draggable { cursor: grab; }
.win-header.draggable:active { cursor: grabbing; }
.win-title { font-size: 13px; font-weight: 500; letter-spacing: 0.5px; opacity: 0.8; }
.win-controls { display: flex; gap: 12px; }
.win-btn { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; transition: 0.2s; background: #444; }
.win-btn.close:hover { background: #FF5F56; }
.win-btn.max:hover { background: #28C840; }

.win-content { flex: 1; overflow-y: auto; position: relative; color: var(--text-main); }

/* Notifications */
#notifications { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
.toast {
  background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
  padding: 12px 20px; border-radius: var(--radius-md); font-size: 13px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3); animation: slideIn 0.3s cubic-bezier(0.2,0.8,0.2,1);
}
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Context Menu */
#context-menu {
  position: fixed; background: rgba(15,15,15,0.9); backdrop-filter: blur(25px);
  border: 1px solid var(--glass-border); border-radius: var(--radius-md); box-shadow: var(--shadow-float);
  padding: 6px; display: none; flex-direction: column; min-width: 220px; z-index: 10000;
}
.cm-item {
  padding: 10px 16px; display: flex; align-items: center; gap: 12px;
  cursor: pointer; border-radius: 8px; font-size: 13px; transition: 0.1s;
}
.cm-item:hover { background: var(--glass-hover); }
.cm-divider { height: 1px; background: var(--glass-border); margin: 4px 0; }

/* Contact App Specifics */
.contact-app { padding: 40px; max-width: 800px; margin: 0 auto; }
.contact-header { display: flex; align-items: center; gap: 24px; margin-bottom: 40px; }
.contact-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 40px; }
.contact-list { display: flex; flex-direction: column; gap: 12px; }
.contact-row {
  display: flex; align-items: center; padding: 16px 24px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: var(--radius-md);
  cursor: pointer; transition: var(--anim-smooth);
}
.contact-row:hover { background: rgba(255,255,255,0.08); transform: translateX(5px); border-color: rgba(255,255,255,0.2); }
.contact-row i { font-size: 20px; width: 40px; color: var(--text-muted); }
.contact-row .details { flex: 1; }
.contact-row .title { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
.contact-row .value { font-size: 15px; font-weight: 500; user-select: text; }
.contact-actions { display: flex; gap: 8px; opacity: 0; transition: 0.2s; }
.contact-row:hover .contact-actions { opacity: 1; }
.action-btn { padding: 8px 16px; border-radius: 20px; background: rgba(255,255,255,0.1); font-size: 12px; }
.action-btn:hover { background: var(--accent); }

/* Project Grid */
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px; padding: 40px; }
.proj-card { aspect-ratio: 16/9; background: #222; border-radius: var(--radius-md); border: 1px solid var(--glass-border); overflow: hidden; cursor: pointer; position: relative; }
.proj-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: 0.3s; }
.proj-card:hover img { opacity: 1; transform: scale(1.05); }
.proj-card .label { position: absolute; bottom: 0; width: 100%; padding: 12px; background: linear-gradient(transparent, #000); font-size: 13px; font-weight: 500; }

</style>
</head>
<body>

<div id="wallpaper"></div>

<div id="desktop">
  <!-- Large Folder Cards -->
  <div class="desktop-card" ondblclick="openApp('projects')" onclick="selectIcon(this, event)">
    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1574629810360-7efbb6b6923f?q=80&w=400');"></div>
    <span>Projects</span>
  </div>
  <div class="desktop-card" ondblclick="openApp('resume')" onclick="selectIcon(this, event)">
    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1586281380349-632531db7ed4?q=80&w=400');"></div>
    <span>Resume.pdf</span>
  </div>
  <div class="desktop-card" ondblclick="openApp('contacts')" onclick="selectIcon(this, event)" oncontextmenu="showContactMenu(event, 'main')">
    <div class="card-bg" style="background-image: url('https://images.unsplash.com/photo-1596524430615-b46475ddff6e?q=80&w=400');"></div>
    <span>Contacts</span>
  </div>
</div>

<div id="windows-layer"></div>

<div id="taskbar">
  <button class="tb-icon" onclick="toggleFullscreen()" title="Fullscreen (F11)"><i class="fa-solid fa-expand"></i></button>
  <div style="width: 1px; height: 24px; background: var(--glass-border); margin: 0 8px;"></div>
  <button class="tb-icon" onclick="openApp('projects')" id="tb-projects"><i class="fa-solid fa-folder-open"></i></button>
  <button class="tb-icon" onclick="openApp('contacts')" id="tb-contacts"><i class="fa-solid fa-address-book"></i></button>
  <button class="tb-icon" onclick="openApp('terminal')" id="tb-terminal"><i class="fa-solid fa-terminal"></i></button>
</div>

<div id="notifications"></div>

<div id="context-menu">
  <!-- Dynamic content injected via JS -->
</div>

<script>
/* --- CORE SYSTEM & DATA --- */
const sysData = {
  profile: {
    name: "Alok Sharma",
    bio: "19yo CSIT Student & Digital Content Creator",
    email: "alokkynwa@gmail.com",
    ig: "alok.ynwa",
    x: "alokynwa",
    phone: "+9779843538473"
  },
  projects: [
    { title: "Liverpool F.C. Posters", img: "https://images.unsplash.com/photo-1600250395376-78e5628b05fc?q=80&w=600" },
    { title: "पत्तासाफ Branding", img: "https://images.unsplash.com/photo-1616469829581-73993eb86b02?q=80&w=600" },
    { title: "DBT Meme Network", img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=600" },
    { title: "Arsenal Bottlejob Parody", img: "https://images.unsplash.com/photo-1522778119026-d647f0596c20?q=80&w=600" },
    { title: "R Stats Practical", img: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=600" }
  ]
};

const APPS = {
  projects: {
    title: "Projects",
    render: () => `
      <div class="proj-grid">
        ${sysData.projects.map(p => `
          <div class="proj-card" onclick="notify('Opening ${p.title} viewer...')">
            <img src="${p.img}" alt="${p.title}">
            <div class="label">${p.title}</div>
          </div>
        `).join('')}
      </div>
    `
  },
  contacts: {
    title: "Contacts",
    render: () => `
      <div class="contact-app">
        <div class="contact-header">
          <div class="contact-avatar"><i class="fa-solid fa-user"></i></div>
          <div>
            <h1 style="font-size: 28px; font-weight: 600; margin-bottom: 4px;">${sysData.profile.name}</h1>
            <p style="color: var(--text-muted); font-size: 14px;">${sysData.profile.bio}</p>
          </div>
        </div>
        <div class="contact-list">
          <div class="contact-row" ondblclick="window.open('https://instagram.com/${sysData.profile.ig}', '_blank')" oncontextmenu="showContactMenu(event, 'ig')">
            <i class="fa-brands fa-instagram"></i>
            <div class="details">
              <div class="title">Instagram</div>
              <div class="value">@${sysData.profile.ig}</div>
            </div>
            <div class="contact-actions">
              <button class="action-btn" onclick="copyText('@${sysData.profile.ig}', 'Instagram Handle')">Copy</button>
              <button class="action-btn" onclick="window.open('https://instagram.com/${sysData.profile.ig}', '_blank')">Open</button>
            </div>
          </div>
          
          <div class="contact-row" ondblclick="window.location.href='mailto:${sysData.profile.email}'" oncontextmenu="showContactMenu(event, 'email')">
            <i class="fa-solid fa-envelope"></i>
            <div class="details">
              <div class="title">Email</div>
              <div class="value">${sysData.profile.email}</div>
            </div>
            <div class="contact-actions">
              <button class="action-btn" onclick="copyText('${sysData.profile.email}', 'Email Address')">Copy</button>
              <button class="action-btn" onclick="window.location.href='mailto:${sysData.profile.email}'">Mail</button>
            </div>
          </div>

          <div class="contact-row" ondblclick="window.location.href='tel:${sysData.profile.phone}'" oncontextmenu="showContactMenu(event, 'phone')">
            <i class="fa-solid fa-phone"></i>
            <div class="details">
              <div class="title">Phone</div>
              <div class="value">${sysData.profile.phone}</div>
            </div>
            <div class="contact-actions">
              <button class="action-btn" onclick="copyText('${sysData.profile.phone}', 'Phone Number')">Copy</button>
            </div>
          </div>
        </div>
      </div>
    `
  },
  resume: {
    title: "Resume.pdf",
    render: () => `<div style="display:flex; height:100%; align-items:center; justify-content:center; flex-direction:column; color:var(--text-muted);">
      <i class="fa-solid fa-file-pdf" style="font-size:64px; margin-bottom:20px; color:#FF5F56;"></i>
      <h2>Alok_Sharma_Resume_2026.pdf</h2>
      <p style="margin-top:10px;">1 Page • 1.2 MB</p>
      <button class="action-btn" style="margin-top:20px; padding:12px 24px;" onclick="notify('Downloading resume...')">Download</button>
    </div>`
  }
};

let zIndex = 50;
const openWindows = new Set();

/* --- WINDOW MANAGEMENT --- */
function openApp(id) {
  if(openWindows.has(id)) {
    const w = document.getElementById(`win-${id}`);
    focusWindow(w);
    return;
  }
  
  const app = APPS[id];
  if(!app) return;

  const win = document.createElement('div');
  win.className = 'os-window active focus';
  win.id = `win-${id}`;
  win.style.zIndex = ++zIndex;
  
  win.innerHTML = `
    <div class="win-header draggable" onmousedown="focusWindow(this.parentElement)">
      <div class="win-title">${app.title}</div>
      <div class="win-controls">
        <div class="win-btn max" onclick="maximizeWindow(this)"></div>
        <div class="win-btn close" onclick="closeApp('${id}')"></div>
      </div>
    </div>
    <div class="win-content">${app.render()}</div>
  `;

  document.getElementById('windows-layer').appendChild(win);
  openWindows.add(id);
  
  makeDraggable(win, win.querySelector('.win-header'));
  
  const tbIcon = document.getElementById(`tb-${id}`);
  if(tbIcon) tbIcon.classList.add('active');
  
  notify(`${app.title} opened`);
}

function closeApp(id) {
  const win = document.getElementById(`win-${id}`);
  if(win) {
    win.style.opacity = '0';
    win.style.transform = 'scale(0.9) translateY(20px)';
    setTimeout(() => {
      win.remove();
      openWindows.delete(id);
      const tbIcon = document.getElementById(`tb-${id}`);
      if(tbIcon) tbIcon.classList.remove('active');
    }, 200);
  }
}

function focusWindow(win) {
  document.querySelectorAll('.os-window').forEach(w => w.classList.remove('focus'));
  win.classList.add('focus');
  win.style.zIndex = ++zIndex;
}

function maximizeWindow(btn) {
  const win = btn.closest('.os-window');
  win.classList.toggle('maximized');
}

/* --- SYSTEM UTILITIES --- */
function notify(msg) {
  const container = document.getElementById('notifications');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<i class="fa-solid fa-check" style="color:var(--accent); margin-right:8px;"></i> ${msg}`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100%)';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

function copyText(text, label) {
  navigator.clipboard.writeText(text).then(() => {
    notify(`${label} copied to clipboard`);
  });
}

function selectIcon(el, e) {
  e.stopPropagation();
  document.querySelectorAll('.desktop-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}

document.body.addEventListener('click', (e) => {
  if(!e.target.closest('.desktop-card')) {
    document.querySelectorAll('.desktop-card').forEach(c => c.classList.remove('selected'));
  }
  if(!e.target.closest('#context-menu')) {
    document.getElementById('context-menu').style.display = 'none';
  }
});

/* --- CONTEXT MENUS --- */
function showContactMenu(e, type) {
  e.preventDefault();
  e.stopPropagation();
  const cm = document.getElementById('context-menu');
  
  let html = '';
  if (type === 'ig') {
    html = `
      <div class="cm-item" onclick="window.open('https://instagram.com/${sysData.profile.ig}')"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open in New Tab</div>
      <div class="cm-item" onclick="copyText('@${sysData.profile.ig}', 'Username')"><i class="fa-solid fa-copy"></i> Copy Username</div>
    `;
  } else if (type === 'email') {
    html = `
      <div class="cm-item" onclick="window.location.href='mailto:${sysData.profile.email}'"><i class="fa-solid fa-envelope"></i> Send Email</div>
      <div class="cm-item" onclick="copyText('${sysData.profile.email}', 'Email')"><i class="fa-solid fa-copy"></i> Copy Email Address</div>
    `;
  } else if (type === 'phone') {
    html = `
      <div class="cm-item" onclick="copyText('${sysData.profile.phone}', 'Phone')"><i class="fa-solid fa-copy"></i> Copy Phone Number</div>
    `;
  } else {
    html = `
      <div class="cm-item" onclick="openApp('contacts')"><i class="fa-solid fa-folder-open"></i> Open Contacts</div>
      <div class="cm-item" onclick="notify('Pinned to Favorites')"><i class="fa-solid fa-thumbtack"></i> Pin to Favorites</div>
    `;
  }
  
  cm.innerHTML = html;
  cm.style.display = 'flex';
  cm.style.left = Math.min(e.clientX, window.innerWidth - 220) + 'px';
  cm.style.top = Math.min(e.clientY, window.innerHeight - 100) + 'px';
}

document.getElementById('desktop').addEventListener('contextmenu', e => {
  if(e.target.closest('.desktop-card')) return;
  e.preventDefault();
  const cm = document.getElementById('context-menu');
  cm.innerHTML = `
    <div class="cm-item" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i> Refresh System</div>
    <div class="cm-divider"></div>
    <div class="cm-item" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i> Toggle Fullscreen</div>
    <div class="cm-item" onclick="notify('Settings opened (Demo)')"><i class="fa-solid fa-palette"></i> Personalize</div>
  `;
  cm.style.display = 'flex';
  cm.style.left = e.clientX + 'px';
  cm.style.top = e.clientY + 'px';
});

/* --- FULLSCREEN API --- */
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().then(() => {
      notify("Entered Immersive Mode");
    }).catch(err => {
      notify("Fullscreen blocked by browser.");
    });
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }
}

/* --- KEYBOARD SHORTCUTS --- */
document.addEventListener('keydown', (e) => {
  if (e.key === 'F11') {
    e.preventDefault();
    toggleFullscreen();
  }
  if (e.ctrlKey && e.key.toLowerCase() === 'f') {
    e.preventDefault();
    notify("System Search activated (Demo)");
  }
  if (e.metaKey && e.key.toLowerCase() === 'd') { // Win+D equivalent
    e.preventDefault();
    document.querySelectorAll('.os-window').forEach(w => w.classList.remove('active'));
  }
});

/* --- DRAG LOGIC --- */
function makeDraggable(el, header) {
  let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
  header.onmousedown = dragMouseDown;

  function dragMouseDown(e) {
    if(el.classList.contains('maximized') || e.target.closest('.win-controls')) return;
    e.preventDefault();
    pos3 = e.clientX; pos4 = e.clientY;
    document.onmouseup = closeDragElement;
    document.onmousemove = elementDrag;
  }

  function elementDrag(e) {
    e.preventDefault();
    pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
    pos3 = e.clientX; pos4 = e.clientY;
    el.style.top = Math.max(0, (el.offsetTop - pos2)) + "px";
    el.style.left = (el.offsetLeft - pos1) + "px";
  }
  function closeDragElement() {
    document.onmouseup = null;
    document.onmousemove = null;
  }
}

// Initial Boot Notification
setTimeout(() => { notify("Alok OS Initialized. Press F11 for full experience."); }, 1000);
</script>
</body>
</html>
