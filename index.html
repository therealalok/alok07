<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<style>
:root{
  --accent:#5B6EF5;
  --accent-rgb:91,110,245;
  --accent-gold:#C9A227;
  --radius:14px;
  --radius-sm:8px;
  --taskbar-size:56px;
  --icon-size:64px;
  --icon-cell:104px;
  --anim:0.22s;
  --anim-ease:cubic-bezier(.2,.8,.2,1);
  --font-ui:'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --font-mono:'Cascadia Code','JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --ink:#12141C;
  --ink-soft:#585F72;
  --paper:#F7F8FB;
  --paper-raise:#FFFFFF;
  --glass:rgba(255,255,255,0.70);
  --glass-strong:rgba(255,255,255,0.86);
  --hairline:rgba(18,20,28,0.10);
  --shadow-win:0 18px 50px -12px rgba(10,12,20,0.35),0 4px 14px -4px rgba(10,12,20,0.20);
  --shadow-soft:0 6px 20px -6px rgba(10,12,20,0.25);
  --wallpaper:linear-gradient(160deg,#1e293b 0%,#0f172a 100%);
}
html.dark{
  --ink:#F1F2F6;
  --ink-soft:#A8AEC0;
  --paper:#181B24;
  --paper-raise:#20232E;
  --glass:rgba(24,27,36,0.72);
  --glass-strong:rgba(28,31,41,0.88);
  --hairline:rgba(255,255,255,0.09);
  --shadow-win:0 18px 50px -12px rgba(0,0,0,0.55),0 4px 14px -4px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;}
body{
  font-family:var(--font-ui);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
button{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
[data-anim="off"] *{transition-duration:0s !important;animation-duration:0.001s !important;}
[data-anim="fast"] *{transition-duration:0.10s !important;}

/* ===== DESKTOP ===== */
#desktop{
  position:fixed;inset:0;
  background:var(--wallpaper);
  transition:background var(--anim) var(--anim-ease);
}
#desktopArea{
  position:absolute;inset:0;
}
body.taskbar-bottom #desktopArea{ bottom:var(--taskbar-size); }
body.taskbar-top #desktopArea{ top:var(--taskbar-size); }
body.taskbar-left #desktopArea{ left:var(--taskbar-size); }
body.taskbar-right #desktopArea{ right:var(--taskbar-size); }

#iconLayer{position:absolute;inset:0;padding:20px;}
.icon{
  position:absolute;
  width:calc(var(--icon-cell) - 12px);
  padding:8px 6px;
  border-radius:10px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:default;
  touch-action:none;
}
.icon.selected, .icon.dragging{background:rgba(var(--accent-rgb),0.32);}
.icon:not(.selected):hover{background:rgba(255,255,255,0.10);}
.icon-glyph{width:var(--icon-size);height:var(--icon-size);display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 6px 10px rgba(0,0,0,0.35));}
.icon-glyph svg{width:100%;height:100%;}
.icon-label{
  color:#fff;font-size:12.5px;text-align:center;line-height:1.25;
  text-shadow:0 1px 3px rgba(0,0,0,0.55);
  max-width:100%;word-break:break-word;
  padding:1px 4px;border-radius:4px;
}
.icon-label input{
  width:90px;font-size:12.5px;text-align:center;border-radius:4px;border:1px solid var(--accent);
  padding:1px 3px;font-family:inherit;
}
#selectionRect{
  position:absolute;border:1px solid var(--accent);background:rgba(var(--accent-rgb),0.18);
  border-radius:2px;pointer-events:none;display:none;
}

/* ===== TASKBAR ===== */
#taskbar{
  position:fixed;z-index:900;
  display:flex;align-items:center;gap:4px;
  background:var(--glass-strong);
  backdrop-filter:blur(22px) saturate(1.4);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);
  border-top:1px solid var(--hairline);
  padding:0 8px;
}
body.taskbar-bottom #taskbar{left:0;right:0;bottom:0;height:var(--taskbar-size);border-top:1px solid var(--hairline);flex-direction:row;}
body.taskbar-top #taskbar{left:0;right:0;top:0;height:var(--taskbar-size);border-bottom:1px solid var(--hairline);border-top:none;flex-direction:row;}
body.taskbar-left #taskbar{top:0;bottom:0;left:0;width:var(--taskbar-size);flex-direction:column;padding:8px 0;border-right:1px solid var(--hairline);border-top:none;}
body.taskbar-right #taskbar{top:0;bottom:0;right:0;width:var(--taskbar-size);flex-direction:column;padding:8px 0;border-left:1px solid var(--hairline);border-top:none;}
body.taskbar-left #taskbar,body.taskbar-right #taskbar{gap:10px;}

.tb-btn{
  position:relative;
  width:40px;height:40px;border:none;background:transparent;border-radius:10px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);
  transition:background var(--anim);
}
.tb-btn:hover{background:rgba(var(--accent-rgb),0.16);}
.tb-btn svg{width:20px;height:20px;}
.tb-btn.running::after{
  content:'';position:absolute;left:50%;bottom:2px;width:5px;height:5px;border-radius:50%;
  background:var(--accent);transform:translateX(-50%);
}
body.taskbar-left .tb-btn.running::after,body.taskbar-right .tb-btn.running::after{
  bottom:50%;left:2px;transform:translateY(50%);
}
.tb-btn.active{background:rgba(var(--accent-rgb),0.24);}
#tbStart svg{width:22px;height:22px;}
#tbSpacer{flex:1;}
.tb-sep{width:1px;height:24px;background:var(--hairline);margin:0 4px;}
body.taskbar-left .tb-sep,body.taskbar-right .tb-sep{width:24px;height:1px;margin:4px 0;}
#tbClock{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2px 10px;border-radius:8px;cursor:pointer;font-size:11.5px;line-height:1.3;color:var(--ink);
}
#tbClock:hover{background:rgba(var(--accent-rgb),0.16);}
#tbClock b{font-size:12.5px;font-family:var(--font-mono);}

/* ===== START MENU / POPUPS ===== */
.popup-surface{
  position:fixed;z-index:950;
  background:var(--glass-strong);
  backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);
  border:1px solid var(--hairline);border-radius:var(--radius);
  box-shadow:var(--shadow-win);
  opacity:0;transform:translateY(10px) scale(0.98);pointer-events:none;
  transition:opacity var(--anim) var(--anim-ease),transform var(--anim) var(--anim-ease);
}
.popup-surface.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}

#startMenu{width:380px;max-height:520px;display:flex;flex-direction:column;padding:18px;}
#startMenu input{
  width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--hairline);
  background:rgba(128,128,128,0.10);color:var(--ink);font-size:13px;outline:none;
}
#startMenu input:focus{border-color:var(--accent);}
.sm-label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin:14px 0 8px;}
.sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.sm-app{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:10px;cursor:pointer;border:none;background:transparent;color:var(--ink);
}
.sm-app:hover{background:rgba(var(--accent-rgb),0.14);}
.sm-app svg{width:26px;height:26px;}
.sm-app span{font-size:11px;text-align:center;}
#smSearchResults{max-height:180px;overflow:auto;margin-top:6px;}
.sm-result{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12.5px;}
.sm-result:hover{background:rgba(var(--accent-rgb),0.14);}
.sm-result svg{width:16px;height:16px;flex-shrink:0;}
#startFooter{
  margin-top:auto;padding-top:12px;border-top:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:space-between;
}
.sm-user{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);cursor:pointer;padding:6px 8px;border-radius:8px;}
.sm-user:hover{background:rgba(var(--accent-rgb),0.14);}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-gold));flex-shrink:0;}
#powerFlyout{width:190px;padding:8px;}
.pf-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink);}
.pf-item:hover{background:rgba(var(--accent-rgb),0.14);}
.pf-item svg{width:16px;height:16px;}

/* ===== CONTEXT MENU ===== */
#contextMenu{width:220px;padding:6px;}
.cm-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12.8px;color:var(--ink);
}
.cm-item:hover{background:rgba(var(--accent-rgb),0.14);}
.cm-item.disabled{opacity:0.35;pointer-events:none;}
.cm-sep{height:1px;background:var(--hairline);margin:5px 4px;}
.cm-shortcut{font-size:11px;color:var(--ink-soft);}
.cm-sub-label{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);padding:6px 10px 2px;letter-spacing:0.05em;}

/* ===== TRAY POPUPS ===== */
#volumePopup{width:210px;padding:16px;}
#volumePopup input[type=range]{width:100%;}
#calendarPopup{width:250px;padding:16px;}
.cal-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin-bottom:10px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:11.5px;}
.cal-grid div{padding:5px 0;border-radius:6px;color:var(--ink);}
.cal-grid .dow{color:var(--ink-soft);font-weight:600;font-size:10px;}
.cal-grid .today{background:var(--accent);color:#fff;font-weight:700;}
.cal-grid .pad{opacity:0;}
#netPopup,#battPopup{width:200px;padding:14px;font-size:12.5px;color:var(--ink);}

/* ===== NOTIFICATION PANEL ===== */
#notifPanel{
  position:fixed;top:0;bottom:0;width:320px;z-index:940;
  background:var(--glass-strong);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border-left:1px solid var(--hairline);box-shadow:var(--shadow-win);
  padding:18px;display:flex;flex-direction:column;gap:10px;
  transform:translateX(100%);transition:transform var(--anim) var(--anim-ease);
  right:0;
}
body.taskbar-right #notifPanel{right:var(--taskbar-size);}
#notifPanel.open{transform:translateX(0);}
#notifPanel h3{margin:0 0 4px;font-size:14px;}
.notif-item{background:rgba(128,128,128,0.10);border-radius:10px;padding:10px 12px;position:relative;}
.notif-item b{font-size:12.5px;}
.notif-item p{margin:3px 0 0;font-size:11.5px;color:var(--ink-soft);line-height:1.4;}
.notif-item .notif-x{position:absolute;top:6px;right:8px;cursor:pointer;opacity:0.5;font-size:11px;}
.notif-item .notif-x:hover{opacity:1;}
#notifEmpty{color:var(--ink-soft);font-size:12.5px;text-align:center;margin-top:30%;}
.notif-clear{align-self:flex-start;font-size:11.5px;color:var(--accent);cursor:pointer;background:none;border:none;padding:0;}

/* ===== WINDOWS ===== */
#windowsLayer{position:absolute;inset:0;pointer-events:none;}
.window{
  position:absolute;pointer-events:auto;
  display:flex;flex-direction:column;
  background:var(--glass-strong);
  backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);
  border:1px solid var(--hairline);border-radius:var(--radius);
  box-shadow:var(--shadow-win);overflow:hidden;
  min-width:320px;min-height:220px;
}
.window.maximized{border-radius:0;}
.window.focused{border-top:2px solid var(--accent-gold);}
.window.closing{animation:winClose var(--anim) var(--anim-ease) forwards;}
.window.opening{animation:winOpen var(--anim) var(--anim-ease);}
@keyframes winOpen{from{opacity:0;transform:scale(0.96) translateY(6px);}to{opacity:1;transform:none;}}
@keyframes winClose{to{opacity:0;transform:scale(0.96);}}
.win-titlebar{
  height:42px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;
  background:linear-gradient(180deg,rgba(255,255,255,0.16),rgba(255,255,255,0) 60%);
  cursor:default;
}
html.dark .win-titlebar{background:linear-gradient(180deg,rgba(255,255,255,0.06),rgba(255,255,255,0) 60%);}
.win-titlebar svg{width:16px;height:16px;flex-shrink:0;}
.win-title{font-size:12.8px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.win-controls{display:flex;gap:2px;}
.win-ctrl{width:32px;height:28px;border:none;background:transparent;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);}
.win-ctrl:hover{background:rgba(128,128,128,0.18);}
.win-ctrl.close:hover{background:#E81123;color:#fff;}
.win-ctrl svg{width:12px;height:12px;}
.win-body{flex:1;overflow:auto;position:relative;background:rgba(128,128,128,0.03);}
.resize-handle{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;}
.resize-edge-r{position:absolute;top:0;right:0;bottom:0;width:6px;cursor:ew-resize;}
.resize-edge-b{position:absolute;left:0;right:0;bottom:0;height:6px;cursor:ns-resize;}
#snapPreview{position:absolute;background:rgba(var(--accent-rgb),0.28);border:2px solid var(--accent);border-radius:10px;display:none;pointer-events:none;z-index:5;}

/* ===== EXPLORER ===== */
.explorer{display:flex;flex-direction:column;height:100%;}
.exp-toolbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--hairline);flex-shrink:0;}
.exp-toolbar button{width:28px;height:28px;border:none;background:transparent;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);}
.exp-toolbar button:hover:not(:disabled){background:rgba(128,128,128,0.16);}
.exp-toolbar button:disabled{opacity:0.3;cursor:default;}
.exp-toolbar button svg{width:15px;height:15px;}
.exp-breadcrumb{flex:1;display:flex;align-items:center;gap:4px;background:rgba(128,128,128,0.10);border-radius:8px;padding:6px 10px;font-size:12.5px;overflow:auto;white-space:nowrap;}
.exp-crumb{cursor:pointer;color:var(--ink);}
.exp-crumb:hover{color:var(--accent);text-decoration:underline;}
.exp-crumb-sep{color:var(--ink-soft);}
.exp-search{width:130px;padding:6px 9px;border-radius:8px;border:1px solid var(--hairline);background:rgba(128,128,128,0.10);font-size:12px;outline:none;color:var(--ink);}
.exp-search:focus{border-color:var(--accent);}
.exp-body{flex:1;display:flex;overflow:hidden;}
.exp-nav{width:150px;flex-shrink:0;border-right:1px solid var(--hairline);padding:10px 6px;overflow:auto;}
.exp-nav-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;}
.exp-nav-item:hover{background:rgba(var(--accent-rgb),0.14);}
.exp-nav-item.active{background:rgba(var(--accent-rgb),0.22);font-weight:600;}
.exp-nav-item svg{width:15px;height:15px;flex-shrink:0;}
.exp-main{flex:1;overflow:auto;padding:14px;}
.exp-main.list-view{padding:0;}
.grid-items{display:grid;grid-template-columns:repeat(auto-fill,86px);gap:6px;}
.file-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:9px;cursor:pointer;text-align:center;}
.file-item:hover{background:rgba(128,128,128,0.12);}
.file-item.selected{background:rgba(var(--accent-rgb),0.28);}
.file-item svg{width:40px;height:40px;}
.file-item span{font-size:11.3px;line-height:1.25;word-break:break-word;max-width:82px;}
.list-row{display:flex;align-items:center;gap:10px;padding:7px 14px;cursor:pointer;font-size:12.6px;border-bottom:1px solid var(--hairline);}
.list-row:hover{background:rgba(128,128,128,0.10);}
.list-row.selected{background:rgba(var(--accent-rgb),0.20);}
.list-row svg{width:18px;height:18px;flex-shrink:0;}
.list-row .col-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.list-row .col-meta{width:90px;color:var(--ink-soft);font-size:11.5px;}
.list-head{display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);border-bottom:1px solid var(--hairline);}
.list-head svg{width:18px;visibility:hidden;}
.list-head .col-name{flex:1;}
.list-head .col-meta{width:90px;}
.exp-status{border-top:1px solid var(--hairline);padding:6px 14px;font-size:11.3px;color:var(--ink-soft);display:flex;justify-content:space-between;flex-shrink:0;}
.exp-empty{color:var(--ink-soft);font-size:12.8px;text-align:center;margin-top:60px;}

/* ===== VIEWER CONTENT ===== */
.viewer{padding:26px 32px;max-width:640px;margin:0 auto;line-height:1.6;font-size:13.6px;}
.viewer h1{font-size:22px;margin:0 0 4px;}
.viewer h2{font-size:14px;margin:22px 0 8px;color:var(--accent);text-transform:uppercase;letter-spacing:0.04em;}
.viewer .muted{color:var(--ink-soft);font-size:12.5px;}
.viewer .tag{display:inline-block;background:rgba(var(--accent-rgb),0.16);color:var(--accent);padding:3px 10px;border-radius:20px;font-size:11.5px;margin:3px 4px 3px 0;}
.viewer ul{padding-left:20px;}
.viewer .card{background:rgba(128,128,128,0.08);border-radius:10px;padding:14px 16px;margin:10px 0;}
.poster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:20px;}
.poster-card{border-radius:12px;overflow:hidden;box-shadow:var(--shadow-soft);cursor:pointer;}
.poster-thumb{height:110px;display:flex;align-items:center;justify-content:center;}
.poster-thumb svg{width:38px;height:38px;opacity:0.85;}
.poster-name{padding:8px 10px;font-size:11.8px;background:var(--paper-raise);}
.contact-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hairline);}
.contact-row svg{width:18px;height:18px;color:var(--accent);flex-shrink:0;}
.contact-row a{color:var(--ink);text-decoration:none;}
.contact-row a:hover{color:var(--accent);}
.social-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;margin-bottom:8px;background:rgba(128,128,128,0.08);text-decoration:none;color:var(--ink);}
.social-row:hover{background:rgba(var(--accent-rgb),0.14);}
.social-row svg{width:20px;height:20px;color:var(--accent);}

/* ===== SETTINGS ===== */
.settings-body{padding:22px 26px;max-width:520px;}
.set-section{margin-bottom:26px;}
.set-section h3{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin:0 0 12px;}
.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.swatch.active{border-color:var(--ink);transform:scale(1.12);}
.wall-options{display:flex;gap:10px;flex-wrap:wrap;}
.wall-opt{width:64px;height:44px;border-radius:8px;cursor:pointer;border:2px solid transparent;position:relative;}
.wall-opt.active{border-color:var(--accent);}
.seg-control{display:flex;background:rgba(128,128,128,0.12);border-radius:9px;padding:3px;gap:2px;width:fit-content;}
.seg-btn{border:none;background:transparent;padding:7px 14px;border-radius:7px;font-size:12.3px;cursor:pointer;color:var(--ink);}
.seg-btn.active{background:var(--paper-raise);box-shadow:0 1px 4px rgba(0,0,0,0.15);font-weight:600;}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
.set-row label{font-size:13px;}
.slider-row input[type=range]{width:100%;margin-top:8px;}
.toggle{position:relative;width:40px;height:22px;border-radius:20px;background:rgba(128,128,128,0.3);cursor:pointer;flex-shrink:0;}
.toggle.on{background:var(--accent);}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform var(--anim);}
.toggle.on::after{transform:translateX(18px);}

/* ===== RECYCLE BIN ===== */
.bin-toolbar{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--hairline);}
.bin-btn{padding:7px 14px;border-radius:8px;border:1px solid var(--hairline);background:var(--paper-raise);font-size:12.3px;cursor:pointer;color:var(--ink);}
.bin-btn:hover{background:rgba(var(--accent-rgb),0.14);}
.bin-btn:disabled{opacity:0.4;cursor:default;}

/* ===== MUSIC WIDGET ===== */
#musicWidget{
  position:fixed;z-index:850;bottom:20px;right:20px;
  width:280px;border-radius:16px;overflow:hidden;
  background:var(--glass-strong);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);
  border:1px solid var(--hairline);box-shadow:var(--shadow-win);
  transition:all var(--anim) var(--anim-ease);
  display:none;
}
body.taskbar-bottom #musicWidget{bottom:calc(var(--taskbar-size) + 16px);}
body.taskbar-right #musicWidget{right:calc(var(--taskbar-size) + 16px);}
body.taskbar-left #musicWidget{left:calc(var(--taskbar-size) + 16px);right:auto;}
#musicWidget.show{display:block;}
.mw-main{display:flex;align-items:center;gap:12px;padding:12px;}
.mw-art{width:48px;height:48px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent-gold));position:relative;overflow:hidden;}
.mw-art::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.5),transparent 60%);}
.mw-art.playing{animation:artPulse 3s ease-in-out infinite;}
@keyframes artPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.25);}}
.mw-info{flex:1;overflow:hidden;}
.mw-title{font-size:12.6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mw-artist{font-size:11.3px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mw-controls{display:flex;gap:2px;flex-shrink:0;}
.mw-btn{width:26px;height:26px;border:none;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);}
.mw-btn:hover{background:rgba(128,128,128,0.18);}
.mw-btn svg{width:13px;height:13px;}
.mw-btn.play{background:var(--accent);color:#fff;width:30px;height:30px;}
.mw-btn.play:hover{background:var(--accent);filter:brightness(1.1);}
.mw-progress{height:3px;background:rgba(128,128,128,0.25);position:relative;cursor:pointer;}
.mw-progress-fill{height:100%;background:var(--accent);width:0%;}
.mw-expand-btn{position:absolute;top:8px;right:8px;width:22px;height:22px;border:none;background:rgba(128,128,128,0.18);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);}
.mw-expand-btn svg{width:11px;height:11px;}
.mw-close-btn{position:absolute;top:8px;right:36px;width:22px;height:22px;border:none;background:rgba(128,128,128,0.18);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);}
.mw-close-btn svg{width:10px;height:10px;}
#mwQueue{display:none;max-height:220px;overflow:auto;border-top:1px solid var(--hairline);padding:8px;}
#musicWidget.expanded #mwQueue{display:block;}
.mw-q-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;}
.mw-q-item:hover{background:rgba(128,128,128,0.12);}
.mw-q-item.current{background:rgba(var(--accent-rgb),0.18);}
.mw-q-art{width:30px;height:30px;border-radius:6px;flex-shrink:0;}
.mw-q-title{font-size:11.8px;font-weight:600;}
.mw-q-artist{font-size:10.8px;color:var(--ink-soft);}

/* ===== POWER / LOCK / SLEEP / LOGIN OVERLAYS ===== */
.full-overlay{
  position:fixed;inset:0;z-index:990;display:flex;align-items:center;justify-content:center;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity 0.4s ease;color:#fff;
}
.full-overlay.show{opacity:1;pointer-events:auto;}
#lockScreen{background:var(--wallpaper);}
#lockScreen .lock-time{font-size:76px;font-weight:300;font-family:var(--font-mono);}
#lockScreen .lock-date{font-size:16px;margin-top:6px;opacity:0.85;}
#lockScreen .lock-hint{position:absolute;bottom:60px;font-size:13px;opacity:0.7;}
#sleepOverlay{background:#000;}
#sleepOverlay .sleep-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.5);animation:sleepPulse 2.4s ease-in-out infinite;}
@keyframes sleepPulse{0%,100%{opacity:0.25;}50%{opacity:0.8;}}
#powerOverlay{background:#000;}
#powerOverlay .spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,0.25);border-top-color:#fff;animation:spin 0.9s linear infinite;margin-bottom:18px;}
@keyframes spin{to{transform:rotate(360deg);}}
#powerOverlay .power-msg{font-size:14px;opacity:0.85;}
#powerOverlay .final-msg{font-size:14px;opacity:0.8;max-width:320px;text-align:center;line-height:1.6;}
#loginScreen{background:var(--wallpaper);}
#loginScreen .login-avatar{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-gold));margin-bottom:16px;}
#loginScreen .login-name{font-size:18px;font-weight:600;margin-bottom:18px;}
#loginScreen button{
  padding:10px 26px;border-radius:20px;border:1px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.12);
  color:#fff;font-size:13.5px;cursor:pointer;backdrop-filter:blur(10px);
}
#loginScreen button:hover{background:rgba(255,255,255,0.22);}

/* ===== CONFIRM MODAL ===== */
#confirmOverlay{position:fixed;inset:0;z-index:995;background:rgba(0,0,0,0.35);display:none;align-items:center;justify-content:center;}
#confirmOverlay.show{display:flex;}
#confirmModal{width:300px;background:var(--glass-strong);backdrop-filter:blur(24px);border:1px solid var(--hairline);border-radius:var(--radius);box-shadow:var(--shadow-win);padding:20px;}
#confirmModal p{font-size:13.2px;margin:0 0 16px;color:var(--ink);line-height:1.5;}
#confirmModal .cm-actions{display:flex;justify-content:flex-end;gap:8px;}
#confirmModal button{padding:8px 16px;border-radius:8px;border:none;font-size:12.6px;cursor:pointer;}
#confirmModal .btn-cancel{background:rgba(128,128,128,0.18);color:var(--ink);}
#confirmModal .btn-confirm{background:var(--accent);color:#fff;}

@media (max-width:720px){
  .exp-nav{width:110px;}
  #musicWidget{width:calc(100% - 32px);right:16px;left:16px;}
}
</style>

function fmtTime(d){ let h=d.getHours(), m=d.getMinutes(); let ap=h>=12?'PM':'AM'; let h12=h%12; if(h12===0)h12=12; return (h12+':'+String(m).padStart(2,'0')+' '+ap); }

function hexToRgb(hex){
  const v = hex.replace('#','');
  const n = parseInt(v.length===3? v.split('').map(c=>c+c).join(''):v,16);
  return `${(n>>16)&255},${(n>>8)&255},${n&255}`;
}

function renderIcons(){
  const layer = $('#iconLayer');
  layer.innerHTML='';
  state.icons.forEach(ic=>{
    const node = FS[ic.fsKey];
    if(!node) return;
    const isBin = false;
    const iconName = node.type==='folder' ? 'folder' : (node.icon||'document');
    const el = document.createElement('div');
    el.className = 'icon' + (state.selected.has(ic.id)?' selected':'');
    el.style.left = ic.x+'px'; el.style.top = ic.y+'px';
    el.dataset.id = ic.id;
    el.innerHTML = `<div class="icon-glyph">${icon(iconName)}</div><div class="icon-label" data-label>${node.name}</div>`;
    wireIconEvents(el, ic);
    layer.appendChild(el);
  });
  // recycle bin, fixed special icon
  const binEl = document.createElement('div');
  const binFull = state.recycleBin.length>0;
  binEl.className='icon'+(state.selected.has('recyclebin')?' selected':'');
  const binIdx = state.icons.length;
  binEl.style.left='24px'; binEl.style.top=(24+binIdx*(ICON_SIZES[state.settings.iconSize]+40))+'px';
  binEl.dataset.id='recyclebin';
  binEl.innerHTML = `<div class="icon-glyph">${icon(binFull?'binFull':'bin')}</div><div class="icon-label">Recycle Bin</div>`;
  wireIconEvents(binEl, {id:'recyclebin', special:'recyclebin', x:24, y:24+binIdx*(ICON_SIZES[state.settings.iconSize]+40)});
  layer.appendChild(binEl);
  document.documentElement.style.setProperty('--icon-size', ICON_SIZES[state.settings.iconSize]+'px');
  document.documentElement.style.setProperty('--icon-cell', (ICON_SIZES[state.settings.iconSize]+40)+'px');
}

function wireIconEvents(el, ic){
  let dragging=false, moved=false, startX=0, startY=0, origPositions=new Map();
  el.addEventListener('pointerdown', e=>{
    e.stopPropagation();
    if(!state.selected.has(ic.id) && !e.ctrlKey && !e.metaKey){
      state.selected.clear(); state.selected.add(ic.id);
      $all('.icon',$('#iconLayer')).forEach(n=>n.classList.toggle('selected', n.dataset.id===ic.id));
    } else if(e.ctrlKey || e.metaKey){
      if(state.selected.has(ic.id)) state.selected.delete(ic.id); else state.selected.add(ic.id);
      el.classList.toggle('selected');
    }
    dragging=true; moved=false; startX=e.clientX; startY=e.clientY;
    origPositions.clear();
    state.icons.forEach(i=>{ if(state.selected.has(i.id)) origPositions.set(i.id, {x:i.x,y:i.y}); });
    if(state.selected.has('recyclebin')) origPositions.set('recyclebin',{x:24,y:ic.y});
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx=e.clientX-startX, dy=e.clientY-startY;
    if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
    if(!moved) return;
    origPositions.forEach((pos,id)=>{
      if(id==='recyclebin') return;
      const item = state.icons.find(i=>i.id===id);
      if(item){ item.x = clamp(pos.x+dx,0,4000); item.y = clamp(pos.y+dy,0,4000); }
    });
    renderIcons();
  });
  el.addEventListener('pointerup', e=>{
    dragging=false;
    if(moved){
      state.icons.forEach(i=>{ i.x = Math.round(i.x/20)*20; i.y = Math.round(i.y/20)*20; });
      renderIcons();
    } else {
      // simple click, single select already applied on pointerdown
    }
  });
  el.addEventListener('dblclick', e=>{ e.stopPropagation(); openFromIcon(ic); });
  el.addEventListener('contextmenu', e=>{
    e.preventDefault(); e.stopPropagation();
    if(!state.selected.has(ic.id)){ state.selected.clear(); state.selected.add(ic.id); renderIcons(); }
    showIconContextMenu(e.clientX, e.clientY, ic);
  });
}

function openFromIcon(ic){
  if(ic.special==='recyclebin'){ openRecycleBin(); return; }
  const node = FS[ic.fsKey];
  if(node.type==='folder') openExplorer(['desktop', ic.fsKey]);
  else openViewerFor(ic.fsKey);
}

/* =========================================================================

   ========================================================================= */
(function setupSelectionRect(){
  const area = $('#desktopArea');
  const rectEl = $('#selectionRect');
  let active=false, sx=0, sy=0;
  area.addEventListener('pointerdown', e=>{
    if(e.target.closest('.icon')) return;
    closeAllPopups();
    active=true;
    const bounds = area.getBoundingClientRect();
    sx = e.clientX-bounds.left; sy = e.clientY-bounds.top;
    rectEl.style.left=sx+'px'; rectEl.style.top=sy+'px'; rectEl.style.width='0px'; rectEl.style.height='0px';
    if(!e.ctrlKey && !e.metaKey){ state.selected.clear(); renderIcons(); }
  });
  area.addEventListener('pointermove', e=>{
    if(!active) return;
    const bounds = area.getBoundingClientRect();
    const cx = e.clientX-bounds.left, cy = e.clientY-bounds.top;
    const x = Math.min(sx,cx), y=Math.min(sy,cy), w=Math.abs(cx-sx), h=Math.abs(cy-sy);
    rectEl.style.display='block';
    rectEl.style.left=x+'px'; rectEl.style.top=y+'px'; rectEl.style.width=w+'px'; rectEl.style.height=h+'px';
    const rBox = {left:x,top:y,right:x+w,bottom:y+h};
    $all('.icon',$('#iconLayer')).forEach(elx=>{
      const ib = {left:elx.offsetLeft, top:elx.offsetTop, right:elx.offsetLeft+elx.offsetWidth, bottom:elx.offsetTop+elx.offsetHeight};
      const hit = !(ib.left>rBox.right || ib.right<rBox.left || ib.top>rBox.bottom || ib.bottom<rBox.top);
      elx.classList.toggle('selected', hit);
      if(hit) state.selected.add(elx.dataset.id); else if(!e.ctrlKey) state.selected.delete(elx.dataset.id);
    });
  });
  area.addEventListener('pointerup', ()=>{ active=false; rectEl.style.display='none'; });
})();

    if(it==='sep') return '<div class="cm-sep"></div>';

    return `<div class="cm-item ${it.disabled?'disabled':''}" onclick='${it.action}'>${it.label}${it.shortcut?`<span class="cm-shortcut">${it.shortcut}</span>`:''}</div>`;
  }).join('');
}
function showMenuAt(el, x, y){

  el.style.top = Math.min(y, vh-h-8)+'px';
}

function getIconById(id){ return state.icons.find(i=>i.id===id) || (id==='recyclebin'?{id:'recyclebin',special:'recyclebin'}:null); }
document.addEventListener('contextmenu', e=>{
  if(e.target.closest('#desktopArea') && !e.target.closest('.icon')){
    e.preventDefault(); showDesktopContextMenu(e.clientX,e.clientY);
  }
});
document.addEventListener('pointerdown', e=>{
  if(!e.target.closest('.popup-surface') && !e.target.closest('#tbStart') && !e.target.closest('#tbVolume') && !e.target.closest('#tbNetwork') && !e.target.closest('#tbBattery') && !e.target.closest('#tbClock')){
    closeAllPopups();
  }
});
function setIconSize(size){ state.settings.iconSize=size; renderIcons(); closeAllPopups(); saveSettings(); syncSettingsUI(); }
function arrangeIcons(){
  const sizeStep = ICON_SIZES[state.settings.iconSize]+40;
  state.icons.forEach((ic,i)=>{ ic.x=24; ic.y=24+i*sizeStep; });
  renderIcons(); closeAllPopups();
}
function renameIcon(id){
  const ic = getIconById(id);
  const el = $(`.icon[data-id="${id}"] .icon-label`);
  if(!el) return;
  const node = FS[ic.fsKey];
  const current = node.name;
  el.innerHTML = `<input value="${current}" />`;
  const input = el.querySelector('input');
  input.focus(); input.select();
  function commit(){ const val = input.value.trim(); if(val) node.name = val; renderIcons(); }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') input.blur(); if(e.key==='Escape'){ el.textContent=current; } });
  closeAllPopups();
}
function deleteIcon(id){
  const idx = state.icons.findIndex(i=>i.id===id);
  if(idx===-1) return;
  const [removed] = state.icons.splice(idx,1);
  state.recycleBin.push(removed);
  state.selected.delete(id);
  renderIcons(); closeAllPopups();
  renderRecycleWindows();
}
function showProperties(id){
  const ic = getIconById(id);
  const node = FS[ic.fsKey];
  const el = $('#confirmModal');
  el.innerHTML = `<p><b>${node.name}</b><br><span style="color:var(--ink-soft);font-size:12px;">Type: ${node.type==='folder'?'Folder':'File'}<br>Location: Desktop</span></p><div class="cm-actions"><button class="btn-confirm" onclick="closeConfirm()">OK</button></div>`;
  $('#confirmOverlay').classList.add('show');
}
function closeConfirm(){ $('#confirmOverlay').classList.remove('show'); }

/* Global keyboard shortcuts */
document.addEventListener('keydown', e=>{
  if(state.power!=='desktop'){
    if(state.power==='locked' || state.power==='asleep'){ unlockOrWake(); }
    return;
  }
  const tag = document.activeElement.tagName;
  if(tag==='INPUT' || tag==='TEXTAREA') return;
  if(e.key==='Delete' && state.selected.size>0){
    Array.from(state.selected).forEach(id=>{ if(id!=='recyclebin') deleteIcon(id); });
  }
  if(e.key==='F2' && state.selected.size===1){ renameIcon(Array.from(state.selected)[0]); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='a'){
    e.preventDefault();
    state.icons.forEach(i=>state.selected.add(i.id));
    renderIcons();
  }
  if(e.key==='Escape'){ state.selected.clear(); renderIcons(); closeAllPopups(); }
  if(e.key==='F5'){ renderIcons(); }
});
