<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Alok Sharma — Cinematic Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

<style>
:root{
  --bg:#06111B;
  --surface:rgba(255,255,255,.05);
  --border:rgba(255,255,255,.08);
  --text:#F2F0EA;
  --muted:#8793A3;
  --gold:#D6C28A;
  --shadow:0 20px 80px rgba(0,0,0,.45);
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:Inter;
  background:linear-gradient(135deg,#031421,#071826,#0B1118);
  color:var(--text);
  overflow-x:hidden;
}

/* CURSOR */
.cursor-dot,.cursor-ring{
  position:fixed;
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:9999;
}
.cursor-dot{
  width:8px;height:8px;
  background:var(--gold);
  border-radius:50%;
}
.cursor-ring{
  width:40px;height:40px;
  border:1px solid var(--gold);
  border-radius:50%;
}

/* HEADER */
header{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  padding:16px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,.4);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:999px;
}

.logo{
  font-weight:800;
  font-size:1.3rem;
}
.logo span{color:var(--gold);}

nav{display:flex;gap:25px;}
nav a{
  color:var(--muted);
  text-decoration:none;
  font-weight:600;
}
nav a:hover{color:var(--text);}

/* SECTIONS */
section{padding:120px 8%;}

.section-title{
  text-align:center;
  font-size:clamp(2.5rem,6vw,5rem);
  font-weight:800;
}
.section-title span{color:var(--gold);}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
}

.hero-container{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:50px;
  max-width:1300px;
  margin:auto;
}

.hero h1{
  font-size:clamp(4rem,10vw,9rem);
  font-weight:900;
}
.hero h1 span{color:var(--gold);}
.hero p{color:var(--muted);max-width:600px;line-height:1.8;}

/* BUTTONS */
.btn{
  display:inline-block;
  padding:14px 28px;
  border-radius:999px;
  font-weight:700;
  text-decoration:none;
  transition:.35s ease;
  margin-right:10px;
}

.btn-primary{
  background:var(--gold);
  color:#111;
}

.btn-secondary{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
}

/* INVERT BUTTON HOVER */
.btn:hover{
  transform:translateY(-5px);
}

.btn-primary:hover{
  background:#111;
  color:var(--gold);
  border:1px solid var(--gold);
}

.btn-secondary:hover{
  background:var(--text);
  color:#111;
}

/* PROJECTS */
.projects-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:25px;
}

.project{
  height:500px;
  border-radius:25px;
  overflow:hidden;
  position:relative;
  background:var(--surface);
  transition:.4s ease;
}

.project img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:1s ease;
}

.project:hover img{
  transform:scale(1.08);
}

.project:hover{
  transform:translateY(-10px);
  border:1px solid rgba(214,194,138,.4);
  filter:brightness(1.1);
}

/* CONTACT */
.contact-box{
  max-width:1100px;
  margin:auto;
  padding:70px;
  border-radius:35px;
  background:var(--surface);
  border:1px solid var(--border);
  text-align:center;
}

.contact-actions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
  margin:40px 0;
}

.contact-card{
  display:flex;
  gap:18px;
  padding:22px;
  border-radius:25px;
  text-decoration:none;
  color:var(--text);
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  transition:.35s ease;
}

.contact-icon{
  width:55px;
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  background:rgba(214,194,138,.1);
  color:var(--gold);
}

/* INVERT CONTACT CARD */
.contact-card:hover{
  background:var(--text);
  color:#111;
  transform:translateY(-6px);
}

.contact-card:hover .contact-icon{
  background:#111;
  color:var(--gold);
}

/* SOCIALS */
.socials{
  display:flex;
  justify-content:center;
  gap:14px;
}

.socials a{
  width:55px;
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(255,255,255,.04);
  color:var(--text);
  text-decoration:none;
  transition:.35s ease;
}

/* BRAND COLORS ON HOVER */
.socials a[href*="github"]:hover{
  background:#fff;
  color:#000;
}

.socials a[href*="linkedin"]:hover{
  background:#0A66C2;
  color:#fff;
}

.socials a[href*="instagram"]:hover{
  background:radial-gradient(circle at 30% 110%, #fdf497, #fd5949, #d6249f, #285AEB);
  color:#fff;
}

.socials a[href*="x.com"]:hover{
  background:#000;
  color:#fff;
}

/* FOOTER */
footer{
  padding:30px;
  text-align:center;
  color:var(--muted);
  border-top:1px solid var(--border);
}
</style>
</head>

<body>

<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<header>
  <div class="logo">Alok<span>.</span></div>
  <nav>
    <a href="#home">Home</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="hero" id="home">
  <div class="hero-container">
    <div>
      <h1>ALOK <span>SHARMA</span></h1>
      <p>Cinematic sports designer crafting football visuals, editorial graphics, and premium storytelling designs.</p>

      <a class="btn btn-primary" href="#projects">View Work</a>
      <a class="btn btn-secondary" href="#contact">Contact</a>
    </div>

    <div>
      <img src="main.jpg" style="width:100%;border-radius:25px;">
    </div>
  </div>
</section>

<section id="projects">
  <h2 class="section-title">Featured <span>Work</span></h2>

  <div class="projects-grid">
    <div class="project"><img src="img1.jpg"></div>
    <div class="project"><img src="img2.jpg"></div>
    <div class="project"><img src="img3.jpg"></div>
  </div>
</section>

<section id="contact">
  <div class="contact-box">
    <h2>Let's Connect</h2>

    <div class="contact-actions">
      <a class="contact-card" href="mailto:test@gmail.com">
        <div class="contact-icon"><i class="fa fa-envelope"></i></div>
        <div>test@gmail.com</div>
      </a>

      <a class="contact-card" href="tel:+977000000000">
        <div class="contact-icon"><i class="fa fa-phone"></i></div>
        <div>+977 000000000</div>
      </a>
    </div>

    <div class="socials">
      <a href="https://github.com"><i class="fab fa-github"></i></a>
      <a href="https://linkedin.com"><i class="fab fa-linkedin"></i></a>
      <a href="https://instagram.com"><i class="fab fa-instagram"></i></a>
      <a href="https://x.com"><i class="fab fa-x-twitter"></i></a>
    </div>
  </div>
</section>

<footer>© 2026 Alok Sharma — Cinematic Portfolio</footer>

<script>
const dot=document.querySelector(".cursor-dot");
const ring=document.querySelector(".cursor-ring");

window.addEventListener("mousemove",(e)=>{
  dot.style.left=e.clientX+"px";
  dot.style.top=e.clientY+"px";
  ring.style.left=e.clientX+"px";
  ring.style.top=e.clientY+"px";
});
</script>

</body>
</html>
