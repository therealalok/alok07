    <style>
        :root{
            --bg-gradient: linear-gradient(135deg, #031421, #071826, #0B1118);
            --canvas-opacity: 0.45; 
            --grid-color: rgba(214, 194, 138, 0.35); 
            --surface: rgba(255, 255, 255, .045);
            --surface2: rgba(255, 255, 255, .03);
            --border: rgba(255, 255, 255, .08);
            --text: #F8F8F5;
            --muted: #C3D1E0;
            --gold: #D6C28A;
            --gold-soft: #C9B67E;
            --shadow: 0 25px 90px rgba(0, 0, 0, .55);
            --gold-gradient: linear-gradient(135deg, #FFF7E6 0%, #D6C28A 50%, #A68E51 100%);
            --dot-glow-color: #D6C28A;
            --education-bg: rgba(214, 194, 138, 0.05);
            --education-border: rgba(214, 194, 138, 0.25);
            --dark-blue-glow: 0 30px 60px rgba(3, 20, 33, 0.85), 0 0 40px rgba(214, 194, 138, 0.25);
            --skills-bg: rgba(214, 194, 138, 0.06);
            --skills-border: rgba(214, 194, 138, 0.3);
            --timeline-text: #F8F8F5;
            --timeline-muted: #C3D1E0;
            --btn-hover-bg: #F8F8F5;
            --placeholder-color: rgba(248, 248, 245, 0.5);
            --project-text: #D6C28A;
            --project-muted: #CBD2D9;
            --ring-border: rgba(214, 194, 138, 0.5);
            --title-glow: 0 0 25px rgba(214, 194, 138, 0.65), 0 0 10px rgba(214, 194, 138, 0.4);
            --header-bg: rgba(4, 14, 22, 0.92); /* Increased opacity to maintain minimal look without filter lag */
            --nav-link: #C3D1E0;
            --sub-ambient-dust: rgba(214, 194, 138, 0.45); 
            --card-glass: rgba(4, 14, 22, 0.9);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #EBF1F6 0%, #DCE4EC 50%, #CAD5E2 100%);
            --canvas-opacity: 0.65;
            --grid-color: rgba(160, 138, 79, 0.3);
            --surface: rgba(12, 34, 52, 0.04);
            --surface2: rgba(12, 34, 52, 0.02);
            --border: rgba(12, 34, 52, 0.1);
            --text: #0B1926;
            --muted: #42586E;
            --shadow: 0 25px 65px rgba(12, 34, 52, 0.12);
            --dot-glow-color: #B29D64;
            --dark-blue-glow: 0 20px 50px rgba(12, 34, 52, 0.08);
            --education-bg: rgba(214, 194, 138, 0.15);
            --education-border: rgba(178, 157, 100, 0.5);
            --skills-bg: rgba(214, 194, 138, 0.15);
            --skills-border: rgba(178, 157, 100, 0.5);
            --timeline-text: #0B1926;
            --timeline-muted: #384C5E;
            --btn-hover-bg: #0B1926;
            --placeholder-color: rgba(12, 34, 52, 0.6);
            --project-text: #8C7844;
            --project-muted: #384C5E;
            --ring-border: rgba(12, 34, 52, 0.35);
            --title-glow: 0 4px 20px rgba(178, 157, 100, 0.3);
            --header-bg: rgba(235, 241, 246, 0.95);
            --nav-link: #384C5E;
            --gold: #A08A4F;
            --gold-gradient: linear-gradient(135deg, #604E20 0%, #A08A4F 50%, #D4C498 100%);
            --sub-ambient-dust: rgba(160, 138, 79, 0.25);
            --card-glass: rgba(255, 255, 255, 0.95);
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            scroll-behavior:smooth;
        }

        html{
            overflow-x:hidden;
        }

        body{
            font-family:'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color:var(--text);
            overflow-x:hidden;
            position:relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background 0.4s ease, color 0.4s ease;
        }

        #studio-loader {
            position: fixed;
            inset: 0;
            background: #040e16;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 35px;
            overflow: hidden;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        }
        .loader-logo-wrap {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loader-img-element {
            width: 90px;
            height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(214, 194, 138, 0.6));
            z-index: 2;
            transform: scale(0);
        }
        .loader-pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1.5px solid var(--gold);
            border-radius: 50%;
            opacity: 0;
            transform: scale(0.3);
            z-index: 1;
        }

        .loader-bar-container {
            width: 200px;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }
        .loader-bar-progress {
            position: absolute;
            top: 0; left: 0; height: 100%;
            width: 0%;
            background: var(--gold-gradient);
            transition: width 0.4s ease;
        }

        ::-webkit-scrollbar {
            width: 10px;
            background: #040e16;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
            border-left: 1px solid var(--border);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #A68E51 0%, #D6C28A 50%, #FFF7E6 100%);
            border-radius: 20px;
            border: 2px solid #040e16;
            transition: all 0.3s ease;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #FFF7E6;
            box-shadow: 0 0 15px rgba(214, 194, 138, 0.85);
        }

        #grid-distortion{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            z-index:-5;
            opacity: var(--canvas-opacity);
            pointer-events:none;
            transform: translateZ(0);
            will-change: transform;
        }

        #dust-ambient-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -3;
            pointer-events: none;
        }

        /* REMOVED: High latency AI turbulence fractal background noise generation filter to ensure flat-smooth minimalist design rules */
        body::before {
            display: none;
        }

        .led-source-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        .led-beam {
            position: absolute;
            top: 0;
            width: 38vw;
            height: 100vh;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0.14;
            filter: blur(85px);
        }

        .led-beam-left {
            left: 0;
            background: linear-gradient(90deg, #ffffff 0%, rgba(255,255,255,0.35) 25%, transparent 100%);
        }

        .led-beam-right {
            right: 0;
            background: linear-gradient(-90deg, #ffffff 0%, rgba(255,255,255,0.35) 25%, transparent 100%);
        }

        .side-floating-nav {
            position: fixed;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 1001;
        }

        .side-nav-btn {
            width: 52px;
            height: 52px;
            border-radius: 4px; 
            background: rgba(4, 14, 22, 0.95); /* Fixed backdrop blur lag by substituting solid high-opacity minimal colors */
            border: 1px solid var(--gold);
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            position: relative;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .side-nav-btn i {
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .side-nav-btn.nav-mail:hover {
            border-color: var(--gold);
            color: #ea4335;
            background: #ffffff;
            transform: scale(1.1) translateX(-4px);
            box-shadow: 0 0 25px rgba(214, 194, 138, 0.6);
        }

        .side-nav-btn.nav-linkedin:hover {
            border-color: #0a66c2;
            color: #ffffff;
            background: #0a66c2;
            transform: scale(1.1) translateX(-4px);
            box-shadow: 0 0 25px rgba(10, 102, 194, 0.65);
        }

        .side-nav-btn.nav-github:hover {
            border-color: #24292e;
            color: #ffffff;
            background: #24292e;
            transform: scale(1.1) translateX(-4px);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
        }

        .side-nav-btn.nav-phone:hover {
            border-color: #25d366;
            color: #ffffff;
            background: #25d366;
            transform: scale(1.1) translateX(-4px);
            box-shadow: 0 0 25px rgba(37, 211, 102, 0.6);
        }

        .side-nav-btn:hover i {
            transform: scale(1.05);
        }

        @media(max-width: 768px) {
            .side-floating-nav { right: 14px; gap: 10px; }
            .side-nav-btn { width: 44px; height: 44px; font-size: 1.1rem; }
        }

        .cursor-dot {
            width: 6px;
            height: 6px;
            background: var(--gold);
            position: fixed;
            top: 0;
            left: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate3d(var(--cursor-x, -100px), var(--cursor-y, -100px), 0) translate(-50%, -50%);
            will-change: transform;
        }

        .cursor-ring {
            width: 32px;
            height: 32px;
            border: 1px solid var(--ring-border);
            position: fixed;
            top: 0;
            left: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate3d(var(--cursor-x, -100px), var(--cursor-y, -100px), 0) translate(-50%, -50%);
            will-change: transform, width, height, background;
            transition: width .2s cubic-bezier(0.25, 1, 0.5, 1), height .2s cubic-bezier(0.25, 1, 0.5, 1), background .2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @media (pointer: coarse) {
            .cursor-dot, .cursor-ring {
                display: none !important;
            }
        }

        header{
            position:fixed;
            top:22px; left:50%;
            transform:translateX(-50%);
            width:92%; max-width:1450px;
            padding:22px 45px;
            display:flex; justify-content:space-between; align-items:center;
            background: var(--header-bg);
            /* REMOVED backdrop-filter blur system to eliminate zoom rendering performance issues */
            border:1px solid var(--border);
            border-radius:100px;
            z-index:1000;
            box-shadow:var(--shadow);
            transition: padding 0.3s ease, background 0.3s ease;
        }

        .logo{
            font-size:1.75rem;
            font-weight:800;
            color: var(--gold);
            letter-spacing: -1.5px;
            text-shadow: 0 0 10px rgba(214, 194, 138, 0.35);
            user-select: none;
        }
        .logo span{ background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .nav-container { display: flex;
            align-items: center; gap: 40px; }
        nav{ display:flex; gap:40px; }
        nav a{ text-decoration:none; color:var(--nav-link); font-weight:700; font-size: 1.2rem; position:relative; letter-spacing: 0.3px;
            transition: color 0.3s ease;
        }
        nav a::after{ content:''; position:absolute; left:0; bottom:-8px; width:0%; height:2px;
            background:var(--gold); transition:.35s ease;
        }
        nav a:hover{ color:var(--text);
        }
        nav a:hover::after{ width:100%; }

        .theme-switch-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px; height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem;
            transition: all 0.3s ease;
        }
        .theme-switch-btn:hover {
            background: var(--text);
            color: var(--btn-hover-bg);
            transform: scale(1.05);
        }

        section { 
            padding: 120px 5%;
            position: relative; 
            z-index: 2; 
            background: transparent !important; 
        }

        .section-title-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 110px;
        }

        .section-title {
            font-size: clamp(2.4rem, 5vw, 5.5rem);
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -2px;
            text-transform: uppercase;
            position: relative;
            display: inline-flex;
            max-width: max-content;
            text-align: center;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -22px;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--gold-gradient);
            border-radius: 99px;
            box-shadow: var(--title-glow);
        }

        .hero{ min-height:100vh; display:flex; align-items:center; padding-top:130px; }
        .hero-container{ max-width:1450px; margin:auto; display:grid; grid-template-columns:1.1fr .9fr; gap:50px; align-items:center; width:100%; }

        .hero-subtitle{ 
            font-size: clamp(2.4rem, 4vw, 3.2rem);
            letter-spacing:10px;
            color:var(--gold); 
            margin-bottom:25px; 
            font-weight:800; 
        }

        .hero h1{ font-size:clamp(4rem, 9vw, 9.5rem); line-height:.9; font-weight:800; letter-spacing:-5px;
            margin:0; }
        .hero h1 span{ background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .hero-emblem-layout {
            display: flex;
            align-items: stretch;
            gap: clamp(25px, 4vw, 45px);
            margin-bottom: 35px;
            width: 100%;
        }
        .hero-large-flag-box {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: clamp(100px, 14vw, 190px);
        }
        .hero-large-flag-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 20px 45px rgba(3, 20, 33, 0.65));
        }
        .hero-name-block {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .hero p{ max-width:720px; line-height:1.9; color:var(--muted);
            font-size:clamp(1.15rem, 2vw, 1.45rem); font-weight: 400; margin-bottom:60px; }

        .hero-buttons{ display:flex; gap:24px; flex-wrap:wrap; }
        
        .btn{ 
            padding: 20px 42px;
            border-radius: 12px; 
            text-decoration: none;
            font-weight: 700; 
            font-size: 1.2rem; 
            transition: all 0.35s ease; 
            display: inline-flex; 
            align-items: center; 
            gap: 12px;
        }

        .primary-btn{ 
            background: var(--gold-gradient);
            color: #111; 
            box-shadow: 0 15px 35px rgba(214,194,138,.3); 
            border: 1px solid var(--gold);
        }
        .primary-btn:hover{ 
            transform: translateY(-6px);
            background: #111; 
            color: var(--gold); 
            box-shadow: 0 20px 40px rgba(214,194,138,.18); 
            border-color: var(--gold);
        }

        .secondary-btn{ 
            background: rgba(255,255,255,.04);
            border: 1px solid var(--border); 
            color: var(--text); 
        }
        .secondary-btn:hover{ 
            transform: translateY(-6px);
            background: #ffffff !important;
            color: #111111 !important; 
            border-color: #ffffff !important; 
        }

        .hero-image-wrapper { display: flex;
            flex-direction: column; align-items: center; gap: 25px; width: 100%; }
        .hero-image{ display:flex; justify-content:center;
            width: 100%; }

        .image-box{
            width: min(500px, 100%);
            aspect-ratio: 1 / 1;
            height: auto;
            border-radius:50%;
            overflow:hidden;
            position:relative;
            border:1px solid var(--gold);
            background:rgba(0,0,0,0.3);
            box-shadow: 0 25px 80px rgba(0,0,0,.45);
            transition: transform 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }

        #hero-dispersion-canvas { width: 100%; height: 100%; display: block; cursor: pointer; transform: translateZ(0);
        }
        .image-box:hover { transform: translateY(-4px) scale(1.015); border-color: var(--gold);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5), 0 0 50px rgba(214, 194, 138, 0.85);
        }

        .dispersion-switch-area { display: flex; align-items: center; gap: 16px;
            background: rgba(4, 14, 22, 0.8); border: 1px solid var(--border); padding: 12px 24px; border-radius: 35px; font-size: 1.15rem; font-weight: 800; letter-spacing: 0.5px;
            color: var(--muted); text-transform: uppercase; }
        .switch-label { cursor: pointer;
            transition: color 0.3s ease; }
        .switch-label.active-label { color: var(--gold);
            text-shadow: 0 0 12px rgba(214, 194, 138, 0.5); }

        .control-toggle { position: relative;
            width: 62px; height: 32px; background: rgba(255, 255, 255, 0.1); border-radius: 20px; cursor: pointer; border: 1px solid var(--border);
            transition: background 0.3s ease; }
        .control-toggle::after { content: ''; position: absolute; top: 3px;
            left: 3px; width: 24px; height: 24px; background: var(--muted); border-radius: 50%; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s ease;
        }
        .control-toggle.toggle-on { background: rgba(214, 194, 138, 0.25); border-color: var(--gold);
        }
        .control-toggle.toggle-on::after { transform: translateX(30px); background: var(--gold-gradient); box-shadow: 0 0 12px var(--gold);
        }

        /* --- UPDATED EDUCATION TIMELINE CORE SYSTEM --- */
        .timeline {
            position: relative;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, transparent, var(--gold) 15%, var(--gold) 85%, transparent);
            transform: translateX(-50%);
            z-index: 1;
        }

        .timeline-item {
            width: 50%;
            padding: 30px 60px;
            position: relative;
            z-index: 2;
        }

        .timeline-item:nth-child(odd) {
            left: 0;
            align-self: flex-start;
        }

        .timeline-item:nth-child(even) {
            left: 50%;
            align-self: flex-start;
        }

        .timeline-dot {
            width: 16px;
            height: 16px;
            background: var(--bg-gradient);
            border: 3px solid var(--gold);
            position: absolute;
            top: 50%;
            border-radius: 50%;
            z-index: 3;
            transform: translateY(-50%);
            box-shadow: 0 0 10px rgba(214, 194, 138, 0.5);
            transition: all 0.3s ease;
        }

        .timeline-item:nth-child(odd) .timeline-dot {
            right: -8px;
        }

        .timeline-item:nth-child(even) .timeline-dot {
            left: -8px;
        }

        .timeline-content {
            padding: 45px;
            border-radius: 24px;
            background: var(--card-glass); 
            border: 1px solid var(--education-border);
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .timeline-content::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--gold-gradient);
            opacity: 0.3;
            transition: opacity 0.4s ease;
        }

        .timeline-content:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            background: var(--card-glass); 
            box-shadow: var(--dark-blue-glow);
        }

        .timeline-content:hover::before { 
            opacity: 1;
        }

        .timeline-content:hover ~ .timeline-dot {
            background: var(--gold);
            box-shadow: 0 0 15px var(--gold);
            transform: translateY(-50%) scale(1.3);
        }

        .year-giant-typography {
            font-size: 1.1rem;
            font-weight: 700;
            background: rgba(214, 194, 138, 0.15);
            color: var(--gold);
            padding: 6px 16px;
            border-radius: 6px;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(214, 194, 138, 0.25);
            transition: all 0.4s ease;
            transform-origin: left;
        }
        
        .timeline-content:hover .year-giant-typography {
            background: var(--gold-gradient);
            color: #111;
        }
        
        .timeline-content h3 { 
            font-size: 1.8rem;
            font-weight: 800; 
            color: var(--timeline-text); 
            letter-spacing: -0.5px; 
            margin-bottom: 16px; 
            line-height: 1.3;
        }

        .timeline-content p { 
            line-height: 1.7;
            color: var(--timeline-muted); 
            font-size: 1.15rem; 
            font-weight: 400; 
        }

        .education-header-flex { 
            display: flex;
            align-items: center; 
            gap: 25px; 
            margin-bottom: 5px; 
            width: 100%;
        }

        .school-logo-mask {
