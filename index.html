--text:#F8F8F5; 
--muted:#C3D1E0; /* Brightened for absolute clarity and scan visibility */

--gold:#D6C28A;
--gold-soft:#C9B67E;

--shadow:0 25px 90px rgba(0,0,0,.55);

--gold-gradient: linear-gradient(135deg, #FFF7E6 0%, #D6C28A 50%, #A68E51 100%);

}

========================================================= */

}

/* =========================================================
DISTORTION GRID
========================================================= */

#grid-distortion{

position:fixed;
top:0;
left:0;

width:100%;
height:100%;

z-index:-5;

opacity:.08;

pointer-events:none;

}

/* =========================================================
GLOW BACKGROUNDS
========================================================= */

.glow{

position:fixed;

border-radius:50%;

filter:blur(120px);

pointer-events:none;

z-index:-4;

opacity:.3;

animation:float 14s ease-in-out infinite;

}

.glow1{

width:500px;
height:500px;

background:rgba(214,194,138,.12);

top:-150px;
left:-120px;

}

.glow2{

width:450px;
height:450px;

background:rgba(130,160,255,.09);

bottom:-150px;
right:-120px;

}

.glow3{

width:380px;
height:380px;

background:rgba(255,255,255,.05);

top:40%;
left:40%;

}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(50px);
}

100%{
transform:translateY(0px);
}

}

/* =========================================================
SCROLLBAR
========================================================= */

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-thumb{

background:var(--gold);

border-radius:20px;

}
