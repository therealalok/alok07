<style>
/* =========================================================================
   REAL macOS COLOR PALETTE & TOKENS
========================================================================= */
:root {
  --bg1: #f5f5f7;
  --bg2: #1c1c1e;
  --bg3: #2c2c2e;
  --bg4: #3a3a3c;
  
  --text-primary: #ffffff;
  --text-secondary: #b8b8be;
  --text-tertiary: #8e8e93;
  
  --blue: #0A84FF;
  --red: #FF453A;
  --yellow: #FFD60A;
  --green: #32D74B;
  --orange: #FF9F0A;

  --os-accent: #0A84FF;
  
  --window-glass: rgba(32,34,38,0.72);
  --sidebar-glass: rgba(255,255,255,0.04);
  --dock-glass: rgba(255,255,255,0.12);
  --menubar-glass: rgba(255,255,255,0.12);
  
  --win-border: rgba(255,255,255,0.10);
  --dock-border: rgba(255,255,255,0.15);
  --shadow-color: rgba(0,0,0,.25);
  --icon-shadow: rgba(0,0,0,.35);

  --radius-win: 16px;
  --radius-dock: 22px;
  --ease: cubic-bezier(0.25, 1, 0.5, 1);
  --font-ui: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  --font-mono: ui-monospace, 'IBM Plex Mono', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overscroll-behavior:none; }
body {
  font-family: var(--font-ui);
  background: #000;
  color: var(--text-primary);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
img { -webkit-user-drag: none; user-drag: none; }
button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }
input, textarea { font-family: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
::selection { background: var(--blue); color: #fff; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.4); border: 2px solid transparent; background-clip: padding-box; }

/* =========================================================================
   DESKTOP & WALLPAPER
========================================================================= */
#desktop {
  position: fixed; inset: 0; z-index: 1;
  background: url('download (87).jpg') center/cover no-repeat;
  /* Instant soft entry - No fake boot screens */
  animation: desktopEntry 0.6s var(--ease) forwards;
}

@keyframes desktopEntry {
  from { opacity: 0; transform: scale(1.02); filter: blur(10px); }
  to { opacity: 1; transform: scale(1); filter: blur(0); }
}

/* =========================================================================
   MENU BAR
========================================================================= */
.menubar {
  position: fixed; top: 0; left: 0; right: 0; height: 28px; z-index: 500;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  background: var(--menubar-glass);
  backdrop-filter: blur(35px);
  -webkit-backdrop-filter: blur(35px);
  border-bottom: 1px solid var(--win-border);
  font-size: 13px; font-weight: 500; letter-spacing: 0.3px; text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.menubar-left, .menubar-right { display: flex; align-items: center; gap: 16px; height: 100%; }
.menubar-left .mb-apple { font-size: 15px; }
.menubar-app-name { font-weight: 700; }
.menubar-item { opacity: 0.9; cursor: default; }
.menubar-item:hover { background: rgba(255,255,255,0.1); border-radius: 4px; padding: 2px 6px; margin: -2px -6px; }
@media (max-width: 860px) { .menubar-item { display: none; } }
.menubar-right i { font-size: 14px; opacity: 0.9; }
.menubar-right button { display: flex; align-items: center; gap: 6px; }
.menubar-clock { letter-spacing: 0.2px; white-space: nowrap; margin-left: 4px; }

/* =========================================================================
   DESKTOP ICONS (Right Aligned, Blue Folders)
========================================================================= */
.desktop-icons {
  position: fixed; top: 60px; right: 20px; z-index: 5;
  display: flex; flex-direction: column; gap: 95px; align-items: center;
}
.desktop-icon {
  width: 72px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 4px; border-radius: 6px; cursor: pointer; transition: background 0.1s;
}
.desktop-icon:hover { background: rgba(255,255,255,0.1); }
.desktop-icon-svg { width: 56px; height: 56px; filter: drop-shadow(0 4px 6px var(--icon-shadow)); }
.desktop-icon span { 
  font-size: 11.5px; text-align: center; color: #fff; 
  text-shadow: 0 1px 3px rgba(0,0,0,.8); font-weight: 500;
  background: rgba(0,0,0,0.1); padding: 1px 4px; border-radius: 4px;
}

/* =========================================================================
   DOCK
========================================================================= */
.dock-wrap {
  position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 600;
  display: flex; align-items: flex-end; gap: 8px;
  padding: 9px 12px; height: 74px; border-radius: var(--radius-dock);
  background: var(--dock-glass);
  backdrop-filter: blur(35px) saturate(180%);
  -webkit-backdrop-filter: blur(35px) saturate(180%);
  border: 1px solid var(--dock-border);
  box-shadow: 0 10px 40px var(--shadow-color), 0 1px 2px rgba(255,255,255,.1) inset;
}
.dock-item {
  position: relative; width: 56px; height: 56px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  background: linear-gradient(180deg, #333, #111);
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
  font-size: 26px; color: #fff;
  transform-origin: bottom center;
}

/* Realistic Dock Magnification using modern CSS */
.dock-wrap:hover .dock-item { transform: scale(1); margin: 0 0px; }
.dock-item:hover { transform: scale(1.35) translateY(-5px) !important; margin: 0 15px !important; z-index: 10; }
.dock-item:has(+ .dock-item:hover), .dock-item:hover + .dock-item { transform: scale(1.15) translateY(-2px) !important; margin: 0 8px !important; z-index: 5; }

.dock-item::after { 
  content: ''; position: absolute; bottom: -8px; width: 4px; height: 4px; 
  border-radius: 50%; background: rgba(255,255,255,0.5); opacity: 0; transition: opacity 0.2s; 
}
.dock-item.running::after { opacity: 1; }
.dock-sep { width: 1px; align-self: stretch; margin: 4px; background: rgba(255,255,255,0.15); }

/* =========================================================================
   WINDOWS LAYER
========================================================================= */
#windows-layer { position: fixed; inset: 0; top: 28px; z-index: 50; pointer-events: none; }
.os-win {
  position: absolute; top: 100px; left: 50%;
  width: 720px; max-width: 90vw; height: 500px; max-height: 80vh;
  transform: translate(-50%, 0);
  background: var(--window-glass);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid var(--win-border); 
  border-radius: var(--radius-win);
  box-shadow: 0 10px 40px var(--shadow-color), 0 1px 2px rgba(255,255,255,.1) inset;
  display: flex; flex-direction: column; overflow: hidden;
  opacity: 0; pointer-events: auto;
  transition: opacity 0.3s var(--ease), transform 0.3s var(--ease), filter 0.3s var(--ease);
  filter: blur(10px);
}
.os-win.open { opacity: 1; transform: translate(-50%, 0); filter: blur(0); }
.os-win.minimized { opacity: 0; transform: translate(-50%, 40vh) scale(0.4); pointer-events: none; }
.os-win.maximized { top: 0 !important; left: 0 !important; width: 100% !important; height: calc(100vh - 28px) !important; max-width: 100%; transform: translate(0,0) !important; border-radius: 0; }
.os-win.dragging { transition: none; }
.os-win.closing { opacity: 0; transform: translate(-50%, 20px); filter: blur(5px); }

/* Window Header / Traffic Lights */
.os-win-header {
  height: 38px; flex: 0 0 auto; display: flex; align-items: center; padding: 0 16px;
  background: transparent; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: default;
}
.traffic { display: flex; gap: 8px; }
.traffic button { 
  width: 12px; height: 12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; 
  box-shadow: 0 0 0 0.5px rgba(0,0,0,0.1) inset; cursor: default;
}
.traffic .t-close { background: #FF5F57; } 
.traffic .t-min { background: #FEBC2E; } 
.traffic .t-max { background: #28C840; }
.traffic button i { font-size: 7px; opacity: 0; color: rgba(0,0,0,0.6); transition: opacity 0.1s; }
.os-win-header:hover .traffic button i { opacity: 1; }
.os-win-title { flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-left: -48px; pointer-events: none;}
.os-win-body { flex: 1; overflow: auto; position: relative; background: transparent; display: flex; }

/* =========================================================================
   FINDER & APP CONTENT STYLES
========================================================================= */
.app-pad { padding: 30px; width: 100%; overflow-y: auto; }
.app-h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); }
.app-lead { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 24px; }

/* Finder Sidebar */
.finder-sidebar { 
  width: 200px; flex: 0 0 auto; background: var(--sidebar-glass); 
  border-right: 1px solid rgba(255,255,255,0.05); padding: 16px 12px; overflow-y: auto;
}
.finder-sb-label { font-size: 11px; font-weight: 600; color: var(--text-tertiary); padding: 4px 8px; margin-bottom: 4px; }
.finder-sb-item { 
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; 
  font-size: 13px; cursor: pointer; color: var(--text-primary); transition: background 0.1s; 
}
.finder-sb-item i { width: 16px; color: #0A84FF; font-size: 14px; text-align: center; }
.finder-sb-item:hover { background: rgba(255,255,255,0.1); }
.finder-sb-item.active { background: rgba(255,255,255,0.15); font-weight: 500; }

.finder-main { flex: 1; overflow-y: auto; padding: 24px; }
.finder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 20px; }
.finder-file { cursor: pointer; text-align: center; padding: 8px; border-radius: 8px; }
.finder-file:hover { background: rgba(255,255,255,0.1); }
.finder-thumb { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; margin-bottom: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
.finder-file-name { font-size: 12px; color: var(--text-primary); line-height: 1.2; word-break: break-word; }

/* Terminal */
.term-body { background: rgba(30,30,30,0.9); width: 100%; height: 100%; padding: 16px; font-family: var(--font-mono); font-size: 13px; color: #f1f1f1; overflow-y: auto; }
.term-prompt { color: #32D74B; font-weight: 600; margin-right: 8px; }
.term-input-row { display: flex; align-items: center; margin-top: 4px; }
.term-input { flex: 1; background: transparent; border: none; color: #fff; font-family: inherit; font-size: inherit; outline: none; }

/* =========================================================================
   RESPONSIVE (iPadOS / Mobile style)
========================================================================= */
@media (max-width: 768px) {
  .os-win { 
    width: 100% !important; height: calc(100% - 28px) !important; 
    max-width: none; max-height: none; 
    top: 28px !important; left: 0 !important; 
    transform: none !important; border-radius: 0; 
  }
  .dock-wrap { bottom: 10px; width: 95%; overflow-x: auto; padding: 6px 8px; height: 64px; }
  .dock-item { width: 44px; height: 44px; font-size: 20px; }
  .dock-item:hover, .dock-wrap:hover .dock-item { transform: none !important; margin: 0 !important; } /* Disable scale on mobile */
  
  .desktop-icons {
    top: 40px; left: 20px; right: auto; gap: 20px;
    display: grid; grid-template-columns: 1fr 1fr; 
  }
  .finder-sidebar { width: 60px; padding: 16px 4px; }
  .finder-sb-label { display: none; }
  .finder-sb-item span { display: none; }
}
</style>
</head>

<script>
(function(){
"use strict";

const PROFILE = {
  name: "Alok Sharma",
  bio: "Computer Science student designing premium football posters, creative visuals, and engaging Instagram reels.",
  email: "alokkynwa@gmail.com",
};

const PROJECTS = {
  "Matchday Graphics": [
    { id:"p1", title:"Portugal VS Colombia", img:"https://images.unsplash.com/photo-1579952363873-27f3bade9f55?w=500&q=80" },
    { id:"p2", title:"Argentina VS Austria", img:"https://images.unsplash.com/photo-1518605368461-1e1252281146?w=500&q=80" },
    { id:"p3", title:"PSG VS Arsenal", img:"https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=500&q=80" }
  ],
  "Tribute Posters": [
    { id:"p7", title:"ONE LAST TIME AT ANFIELD.", img:"https://images.unsplash.com/photo-1614632537197-38a4705f46c6?w=500&q=80" }
  ]
};

// Clock
function fmtTime(d){ return d.toLocaleTimeString([], {hour:'short', minute:'2-digit', weekday:'short', month:'short', day:'numeric'}); }
function tickClock(){
  const now = new Date();
  document.getElementById("mb-clock").textContent = fmtTime(now).replace(/,/g, '');
}
tickClock(); setInterval(tickClock, 1000);

// Window Management
const winLayer = document.getElementById("windows-layer");
const mbAppName = document.getElementById("mb-app-name");
let zTop = 60;
const openWins = new Map();

function bringToFront(win){
  zTop += 1;
  win.style.zIndex = zTop;
  mbAppName.textContent = win.dataset.title || "Finder";
  
  // Sync dock running dots
  document.querySelectorAll(".dock-item").forEach(d => {
    d.classList.toggle("running", openWins.has(d.dataset.app));
  });
}

function makeWindow({id, title, content, onMount}){
  if(openWins.has(id)){
    const existing = openWins.get(id);
    existing.classList.remove("minimized");
    bringToFront(existing);
    return existing;
  }
  
  const win = document.createElement("div");
  win.className = "os-win";
  win.dataset.title = title;
  
  win.innerHTML = `
    <div class="os-win-header">
      <div class="traffic">
        <button class="t-close"><i class="fa-solid fa-xmark"></i></button>
        <button class="t-min"><i class="fa-solid fa-minus"></i></button>
        <button class="t-max"><i class="fa-solid fa-expand"></i></button>
      </div>
      <div class="os-win-title">${title}</div>
    </div>
    <div class="os-win-body">${content}</div>
  `;
  
  winLayer.appendChild(win);
  openWins.set(id, win);

  // Native Window Controls
  win.querySelector(".t-close").addEventListener("click", () => {
    win.classList.add("closing");
    setTimeout(() => { win.remove(); openWins.delete(id); bringToFront(document.body); }, 300);
  });
  
  win.querySelector(".t-min").addEventListener("click", () => win.classList.add("minimized"));
  win.querySelector(".t-max").addEventListener("click", () => win.classList.toggle("maximized"));
  
  win.addEventListener("mousedown", () => bringToFront(win));
  
  // Simple Dragging
  const header = win.querySelector(".os-win-header");
  let isDragging = false, sx, sy, sl, st;
  
  header.addEventListener("mousedown", (e) => {
    if(e.target.closest(".traffic") || win.classList.contains("maximized")) return;
    isDragging = true;
    win.style.transition = "none";
    const rect = win.getBoundingClientRect();
    sx = e.clientX; sy = e.clientY; sl = rect.left; st = rect.top;
  });
  
  document.addEventListener("mousemove", (e) => {
    if(!isDragging) return;
    win.style.left = (sl + (e.clientX - sx)) + "px";
    win.style.top = Math.max(28, st + (e.clientY - sy)) + "px";
    win.style.transform = "none";
  });
  
  document.addEventListener("mouseup", () => {
    if(isDragging) { isDragging = false; win.style.transition = ""; }
  });

  setTimeout(() => { win.classList.add("open"); bringToFront(win); }, 10);
  if(onMount) setTimeout(onMount, 50);
  return win;
}

// App Renderers
function renderAbout() {
  return `<div class="app-pad">
    <h1 class="app-h1">${PROFILE.name}</h1>
    <p class="app-lead">${PROFILE.bio}</p>
    <p style="color:var(--text-tertiary)">Email: ${PROFILE.email}</p>
  </div>`;
}

function renderProjectsFinder(activeCat = "Matchday Graphics"){
  const cats = Object.keys(PROJECTS);
  const sidebar = cats.map(c => `<div class="finder-sb-item ${c===activeCat?'active':''}" data-cat="${c}"><i class="fa-solid fa-folder"></i><span>${c}</span></div>`).join("");
  const files = PROJECTS[activeCat].map(p => `
    <div class="finder-file">
      <img class="finder-thumb" src="${p.img}">
      <div class="finder-file-name">${p.title}</div>
    </div>`).join("");
    
  return `
    <div class="finder-sidebar">
      <div class="finder-sb-label">Favorites</div>
      <div class="finder-sb-item"><i class="fa-solid fa-desktop" style="color:var(--text-tertiary)"></i><span>Desktop</span></div>
      <div class="finder-sb-item"><i class="fa-regular fa-file" style="color:var(--text-tertiary)"></i><span>Documents</span></div>
      <div class="finder-sb-label" style="margin-top:16px;">Tags</div>
      ${sidebar}
    </div>
    <div class="finder-main">
      <h2 style="font-size: 20px; margin-bottom: 20px;">${activeCat}</h2>
      <div class="finder-grid">${files}</div>
    </div>`;
}

function renderTerminal() {
  return `<div class="term-body" id="term-body">
    <div>Last login: ${new Date().toDateString()} on ttys000</div>
    <div>alok@macbook-pro ~ % Welcome to the portfolio.</div>
    <div id="term-log"></div>
    <div class="term-input-row">
      <span class="term-prompt">alok@macbook-pro ~ %</span>
      <input class="term-input" id="term-input" autocomplete="off">
    </div>
  </div>`;
}

// Global App Registry
const APPS = {
  about: { title: "About", render: renderAbout },
  education: { title: "Certifications", render: () => `<div class="app-pad"><h1 class="app-h1">Certifications</h1><p class="app-lead">B.Sc.CSIT - Amrit Science Campus</p></div>` },
  projects: { 
    title: "Finder", 
    render: () => renderProjectsFinder(),
    wire: (win) => {
      win.querySelectorAll(".finder-sb-item[data-cat]").forEach(item => {
        item.addEventListener("click", () => {
          win.querySelector(".os-win-body").innerHTML = renderProjectsFinder(item.dataset.cat);
          APPS.projects.wire(win);
        });
      });
    }
  },
  terminal: {
    title: "Terminal",
    render: renderTerminal,
    wire: (win) => {
      const input = win.querySelector("#term-input");
      input.addEventListener("keydown", (e) => {
        if(e.key === "Enter" && input.value.trim()){
          win.querySelector("#term-log").innerHTML += `<div><span class="term-prompt">alok@macbook-pro ~ %</span>${input.value}</div><div>zsh: command not found: ${input.value}</div>`;
          input.value = "";
        }
      });
      win.addEventListener("click", () => input.focus());
    }
  },
  contact: { title: "Mail", render: () => `<div class="app-pad"><h1 class="app-h1">New Message</h1><p class="app-lead">Reach out at: ${PROFILE.email}</p></div>` }
};

function openApp(id) {
  const app = APPS[id];
  if(!app) return;
  const win = makeWindow({ id, title: app.title, content: app.render(), onMount: () => app.wire && app.wire(win) });
}

// Bind clicks
document.querySelectorAll(".dock-item, .desktop-icon").forEach(el => {
  el.addEventListener("click", () => openApp(el.dataset.app));
});

})();
</script>
</body>
</html>
