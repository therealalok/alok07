<style>
:root {
  --text-primary: #ffffff;
  --text-secondary: #b8b8be;
  --text-tertiary: #8e8e93;
  --blue: #0A84FF;
  
  --window-glass: rgba(30, 30, 32, 0.75);
  --sidebar-glass: rgba(255,255,255,0.04);
  --dock-glass: rgba(255,255,255,0.12);
  --menubar-glass: rgba(0, 0, 0, 0.2);
  
  --win-border: rgba(255,255,255,0.15);
  --dock-border: rgba(255,255,255,0.15);
  --shadow-color: rgba(0,0,0,.4);
  --icon-shadow: rgba(0,0,0,.45);

  --radius-win: 12px;
  --ease: cubic-bezier(0.25, 1, 0.5, 1);
  --font-ui: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  --font-mono: ui-monospace, 'IBM Plex Mono', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overscroll-behavior:none; }
body {
  font-family: var(--font-ui);
  background: #000;
  color: var(--text-primary);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
img { -webkit-user-drag: none; user-drag: none; }
button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; outline: none; }
input, textarea { font-family: inherit; color: inherit; outline: none; }
a { color: inherit; text-decoration: none; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }

#desktop {
  position: fixed; inset: 0; z-index: 1;
  background: url('https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
}

/* MENUBAR */
.menubar {
  position: fixed; top: 0; left: 0; right: 0; height: 28px; z-index: 1000;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  background: var(--menubar-glass);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 13px; font-weight: 500; letter-spacing: 0.3px; text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.menubar-left, .menubar-right { display: flex; align-items: center; gap: 16px; height: 100%; }
.menubar-left .mb-apple { font-size: 15px; cursor: pointer; }
.menubar-app-name { font-weight: 700; cursor: default; }
.menubar-item { opacity: 0.9; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
.menubar-item:hover { background: rgba(255,255,255,0.1); }

.menubar-right i { font-size: 14px; opacity: 0.9; cursor: pointer; padding: 2px 4px; border-radius: 4px;}
.menubar-right i:hover { background: rgba(255,255,255,0.1); }
.menubar-clock { letter-spacing: 0.2px; white-space: nowrap; margin-left: 4px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
.menubar-clock:hover { background: rgba(255,255,255,0.1); }

/* SPOTLIGHT SEARCH */
#spotlight-overlay {
  display: none; position: fixed; top: 15vh; left: 50%; transform: translateX(-50%);
  width: 650px; max-width: 90vw; z-index: 9999;
  background: rgba(30, 30, 32, 0.85); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--win-border); border-radius: 12px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.5); padding: 0;
}
.spotlight-input-wrapper { display: flex; align-items: center; padding: 16px 20px; font-size: 24px; color: #fff; }
.spotlight-input-wrapper i { margin-right: 15px; font-size: 22px; color: var(--text-secondary); }
.spotlight-input-wrapper input { flex: 1; background: transparent; border: none; font-size: 22px; color: #fff; }
.spotlight-input-wrapper input::placeholder { color: var(--text-tertiary); }

/* CONTROL CENTER */
#control-center {
  display: none; position: fixed; top: 35px; right: 10px; width: 320px; z-index: 9999;
  background: rgba(30, 30, 32, 0.85); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--win-border); border-radius: 16px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.4); padding: 16px;
}
.cc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cc-module { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.1s;}
.cc-module:hover { background: rgba(255,255,255,0.15); }
.cc-icon-wrapper { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--blue); color: #fff; font-size: 14px; }
.cc-text h4 { font-size: 13px; font-weight: 600; }
.cc-text p { font-size: 11px; color: var(--text-secondary); margin-top: 2px;}

/* WIDGETS */
.widgets-container { position: fixed; top: 60px; right: 20px; z-index: 10; width: 320px; }
.spotify-glass-wrapper {
  background: var(--window-glass); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px);
  border: 1px solid var(--win-border); border-radius: 18px; padding: 10px;
  box-shadow: 0 10px 40px var(--shadow-color), 0 1px 2px rgba(255,255,255,.1) inset; transition: transform 0.2s;
}

/* DESKTOP ICONS */
.desktop-icons { position: fixed; top: 60px; left: 20px; z-index: 5; display: flex; flex-direction: column; gap: 20px; align-items: center; pointer-events: auto; }
.desktop-icon { width: 76px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; border-radius: 6px; cursor: pointer; pointer-events: auto; }
.desktop-icon:hover { background: rgba(255,255,255,0.15); }
.desktop-icon-svg { width: 56px; height: 56px; filter: drop-shadow(0 3px 5px var(--icon-shadow)); }
.desktop-icon span { font-size: 12px; text-align: center; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); font-weight: 500; padding: 2px 6px; border-radius: 4px; line-height: 1.2; }

/* DOCK */
.dock-wrap {
  position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 600;
  display: flex; align-items: flex-end; gap: 8px; padding: 9px 12px; height: 74px; border-radius: 22px;
  background: var(--dock-glass); backdrop-filter: blur(35px) saturate(180%); -webkit-backdrop-filter: blur(35px) saturate(180%);
  border: 1px solid var(--dock-border); box-shadow: 0 10px 40px var(--shadow-color);
}
.dock-item {
  position: relative; width: 56px; height: 56px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  background: #333; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 26px; color: #fff;
  transform-origin: bottom center; transition: all 0.2s var(--ease);
}
.dock-wrap:hover .dock-item { transform: scale(1); }
.dock-item:hover { transform: scale(1.35) translateY(-5px) !important; margin: 0 15px !important; z-index: 10; }
.dock-item:has(+ .dock-item:hover), .dock-item:hover + .dock-item { transform: scale(1.15) translateY(-2px) !important; margin: 0 8px !important; z-index: 5; }
.dock-item::after { content: ''; position: absolute; bottom: -8px; width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.5); opacity: 0; transition: opacity 0.2s; }
.dock-item.running::after { opacity: 1; }
.dock-sep { width: 1px; align-self: stretch; margin: 4px; background: rgba(255,255,255,0.15); }

/* WINDOWS */
#windows-layer { position: fixed; inset: 0; top: 28px; z-index: 50; pointer-events: none; }
.os-win {
  position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
  width: 720px; max-width: 90vw; height: 500px; max-height: 80vh;
  background: var(--window-glass); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px);
  border: 1px solid var(--win-border); border-radius: var(--radius-win);
  box-shadow: 0 15px 50px rgba(0,0,0,0.5), 0 1px 2px rgba(255,255,255,.1) inset;
  display: flex; flex-direction: column; overflow: hidden; pointer-events: auto;
}
.os-win.minimized { display: none; }
.os-win-header { height: 48px; flex: 0 0 auto; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: grab; }
.os-win-header:active { cursor: grabbing; }
.traffic { display: flex; gap: 8px; }
.traffic button { width: 12px; height: 12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.traffic .t-close { background: #FF5F57; } .traffic .t-min { background: #FEBC2E; } .traffic .t-max { background: #28C840; }
.os-win-title { flex: 1; text-align: center; font-size: 13px; font-weight: 600; margin-left: -48px; pointer-events: none; }
.os-win-body { flex: 1; overflow: auto; display: flex; }

/* APP STYLES */
.app-pad { padding: 30px; width: 100%; overflow-y: auto; }
.app-h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.app-lead { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 24px; }
.finder-sidebar { width: 200px; background: var(--sidebar-glass); border-right: 1px solid rgba(255,255,255,0.05); padding: 16px 12px; flex-shrink: 0; }
.finder-sb-label { font-size: 11px; font-weight: 600; color: var(--text-tertiary); padding: 4px 8px; margin-bottom: 4px; }
.finder-sb-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.finder-sb-item:hover { background: rgba(255,255,255,0.1); }
.finder-sb-item.active { background: rgba(255,255,255,0.15); font-weight: 500; }
.finder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 20px; }
.finder-file { cursor: pointer; text-align: center; padding: 8px; border-radius: 8px; display: block; border: 1px solid transparent; transition: background 0.1s; }
.finder-file:hover { background: rgba(255,255,255,0.1); }
.finder-thumb { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; margin-bottom: 8px; }
.term-body { background: rgba(30,30,30,0.95); width: 100%; height: 100%; padding: 16px; font-family: var(--font-mono); font-size: 13px; color: #f1f1f1; overflow-y: auto; }
.term-prompt { color: #32D74B; font-weight: 600; margin-right: 8px; }

@media (max-width: 768px) {
  .os-win { width: 100% !important; height: calc(100% - 28px) !important; top: 28px !important; left: 0 !important; transform: none !important; border-radius: 0; }
  .dock-wrap { bottom: 10px; width: 95%; overflow-x: auto; padding: 6px 8px; height: 64px; }
  .dock-item { width: 44px; height: 44px; font-size: 20px; }
  .dock-item:hover, .dock-wrap:hover .dock-item { transform: none !important; margin: 0 !important; }
  .widgets-container { display: none; }
  .desktop-icons { flex-direction: row; flex-wrap: wrap; justify-content: center; }
}
</style>
</head>

<script>
const PROFILE = {
  name: "Alok Sharma",
  bio: "I am a 4th semester Computer Science student designing premium football posters, creative visuals, and engaging Instagram reels around European football.",
  email: "alokkynwa@gmail.com"
};

const PROJECTS = {
  "Danke": [
    { title: "ThankyouMo.jpeg", img: "ThankyouMo.jpeg" },
    { title: "ThankyouRobbo.jpeg", img: "ThankyouRobbo.jpeg" },

  ],
  "Matchday": [

    { title: "porcong.jpeg", img: "porcong.jpeg" },
    { title: "portugalvcongo copy.jpg", img: "portugalvcongo copy.jpg" },
    { title: "poruzb copy.jpg", img: "poruzb copy.jpg" },
    { title: "psgvarsfinal copy.jpg", img: "psgvarsfinal copy.jpg" }
  ],
  "Supporters' voice": [
    { title: "slotout.jpeg", img: "slotout.jpeg" }
  ]
};

const EDUCATION = {
  "Education": [
    { title: "ascol.jpg", img: "ascol.jpg" },
    { title: "mdmss-removebg-preview.png", img: "mdmss-removebg-preview.png" },
    { title: "ria-removebg-preview.png", img: "ria-removebg-preview.png" }
  ]
};

const SKILLS = {
  "Skills": [
    { title: "html", img: "latest/icons/html5/html5-original.svg" }, 
    { title: "css", img: "latest/icons/css3/css3-original.svg" },
    { title: "python", img: "latest/icons/python/python-original.svg" },
    { title: "photoshop", img: "latest/icons/photoshop/photoshop-original.svg" }
  ]
};

const winLayer = document.getElementById("windows-layer");
const openWins = new Map();
let zTop = 100;

/* CLOCK */
function tickClock() {
  const clock = document.getElementById("mb-clock");
  if (!clock) return;

  const d = new Date();
  clock.textContent = d.toLocaleString([], {
    weekday: "short",
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });
}

tickClock();
setInterval(tickClock, 1000);

/* SPOTLIGHT */
function toggleSpotlight() {
  const spotlight = document.getElementById("spotlight-overlay");
  const control = document.getElementById("control-center");

  if (!spotlight) return;

  control.style.display = "none";

  spotlight.style.display =
    spotlight.style.display === "block" ? "none" : "block";

  const input = document.getElementById("spotlight-input");
  if (spotlight.style.display === "block" && input) {
    setTimeout(() => input.focus(), 50);
  }
}

function handleSpotlightSearch(e) {
  if (e.key === "Escape") {
    toggleSpotlight();
  }

  if (e.key === "Enter") {
    alert("Searching for: " + e.target.value);
    e.target.value = "";
    toggleSpotlight();
  }
}

/* CONTROL CENTER */
function toggleControlCenter() {
  const control = document.getElementById("control-center");
  const spotlight = document.getElementById("spotlight-overlay");

  if (!control) return;

  spotlight.style.display = "none";

  control.style.display =
    control.style.display === "block" ? "none" : "block";
}

/* CLOSE POPOVERS */
document.addEventListener("click", function (e) {
  const control = document.getElementById("control-center");
  const spotlight = document.getElementById("spotlight-overlay");

  if (
    control &&
    !e.target.closest("#control-center") &&
    !e.target.closest(".fa-wifi") &&
    !e.target.closest(".fa-battery-three-quarters")
  ) {
    control.style.display = "none";
  }

  if (
    spotlight &&
    !e.target.closest("#spotlight-overlay") &&
    !e.target.closest(".fa-magnifying-glass")
  ) {
    spotlight.style.display = "none";
  }
});

/* WINDOW FUNCTIONS */
function bringToFront(win) {
  zTop++;
  win.style.zIndex = zTop;

  const title = document.getElementById("mb-app-name");
  if (title) {
    title.textContent = win.dataset.title || "Finder";
  }
}

function closeApp(id) {
  if (!openWins.has(id)) return;

  openWins.get(id).remove();
  openWins.delete(id);

  document.querySelectorAll(".dock-item").forEach(item => {
    const click = item.getAttribute("onclick") || "";
    if (click.includes(id)) {
      item.classList.remove("running");
    }
  });
}

/* HELPER TO RENDER FILES */
function renderFiles(files) {
  return files.map(f => {
    let thumb = f.img 
      ? `<img class="finder-thumb" src="${f.img}" alt="${f.title}">`
      : `<div class="finder-thumb" style="background:rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center;"><i class="fa-solid fa-file-code" style="font-size:32px; color:var(--text-secondary);"></i></div>`;
    return `
      <div class="finder-file">
        ${thumb}
        <div style="font-size: 11px; margin-top: 4px; word-break: break-word;">${f.title}</div>
      </div>
    `;
  }).join("");
}

/* HELPER TO BUILD FINDER-LIKE APPS WITH PREVIEW */
function createFinderApp(appTitle, dataObj) {
  return {
    title: appTitle,
    render: () => {
      const folders = Object.keys(dataObj);
      const activeFolder = folders[0];
      
      let sidebarHTML = folders.map((f, i) => `
        <div class="finder-sb-item ${i === 0 ? 'active' : ''}" data-folder="${f}">
          <i class="fa-solid fa-folder"></i> ${f}
        </div>
      `).join('');

      return `
        <div style="display:flex; height:100%; width:100%;">
          <div class="finder-sidebar">
            <div class="finder-sb-label">Favorites</div>
            ${sidebarHTML}
          </div>
          <div style="display:flex; flex:1; overflow:hidden;">
            <div class="finder-main" style="flex:1; padding: 24px; overflow-y: auto;">
              <h2 class="folder-title">${activeFolder}</h2>
              <br>
              <div class="finder-grid">
                ${renderFiles(dataObj[activeFolder])}
              </div>
            </div>
            <!-- Half-width preview section -->
            <div class="finder-preview" style="display:none; width:50%; background:rgba(0,0,0,0.15); border-left:1px solid rgba(255,255,255,0.05); padding:24px; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
            </div>
          </div>
        </div>
      `;
    },
    wire: win => {
      const sidebarItems = win.querySelectorAll('.finder-sb-item');
      const grid = win.querySelector('.finder-grid');
      const titleEl = win.querySelector('.folder-title');
      const preview = win.querySelector('.finder-preview');

      function bindFileClicks(folderName) {
        const fileEls = grid.querySelectorAll('.finder-file');
        fileEls.forEach((fileEl, index) => {
          fileEl.addEventListener('click', () => {
            // Highlight selected file
            fileEls.forEach(f => f.style.background = 'transparent');
            fileEl.style.background = 'rgba(255,255,255,0.15)';
            fileEl.style.borderRadius = '8px';
            
            // Show preview pane
            const fileData = dataObj[folderName][index];
            if (fileData.img) {
              preview.style.display = 'flex';
              preview.innerHTML = `
                <img src="${fileData.img}" style="max-width:100%; max-height:75%; object-fit:contain; border-radius:8px; margin-bottom:16px; box-shadow:0 10px 40px rgba(0,0,0,0.6);">
                <h3 style="font-size:15px; font-weight:600; word-wrap:break-word; max-width:100%;">${fileData.title}</h3>
              `;
            } else {
              preview.style.display = 'flex';
              preview.innerHTML = `
                <div style="width:120px; height:120px; background:rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:16px;">
                  <i class="fa-solid fa-file-code" style="font-size:48px; color:var(--text-secondary);"></i>
                </div>
                <h3 style="font-size:15px; font-weight:600; word-wrap:break-word; max-width:100%;">${fileData.title}</h3>
              `;
            }
          });
        });
      }

      sidebarItems.forEach(item => {
        item.addEventListener('click', () => {
          sidebarItems.forEach(sb => sb.classList.remove('active'));
          item.classList.add('active');
          const folderName = item.dataset.folder;
          titleEl.textContent = folderName;
          grid.innerHTML = renderFiles(dataObj[folderName]);
          preview.style.display = 'none'; // reset preview on folder change
          bindFileClicks(folderName);
        });
      });

      // Bind initial clicks on load
      bindFileClicks(sidebarItems[0].dataset.folder);
    }
  };
}

/* APPS */
const APPS = {
  about: {
    title: "About",
    render: () => `
      <div class="app-pad">
        <h1 class="app-h1">${PROFILE.name}</h1>
        <p class="app-lead">${PROFILE.bio}</p>
      </div>
    `
  },

  projects: createFinderApp("Finder", PROJECTS),
  education: createFinderApp("Education", EDUCATION),
  skills: createFinderApp("Skills", SKILLS),

  terminal: {
    title: "Terminal",
    render: () => `
      <div class="term-body">
        <div>Last login: ${new Date().toDateString()}</div>
        <div id="term-log"></div>

        <div style="display:flex;">
          <span class="term-prompt">
            alok@macbook ~ %
          </span>

          <input
            id="term-input"
            style="
              background:none;
              border:none;
              color:white;
              flex:1;
            "
          >
        </div>
      </div>
    `,
    wire: win => {
      const input = win.querySelector("#term-input");
      const log = win.querySelector("#term-log");

      if (!input) return;

      input.focus();

      input.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          const value = input.value.trim();

          if (!value) return;

          log.innerHTML += `
            <div>
              <span class="term-prompt">
                alok@macbook ~ %
              </span>
              ${value}
            </div>

            <div>
              zsh: command not found:
              ${value}
            </div>
          `;

          input.value = "";
        }
      });
    }
  },

  contact: {
    title: "Mail",
    render: () => `
      <div class="app-pad">
        <h1 class="app-h1">New Message</h1>
        <p class="app-lead">${PROFILE.email}</p>
      </div>
    `
  },

  trash: {
    title: "Trash",
    render: () => `
      <div class="app-pad" style="text-align:center;">
        <h2>Trash is empty</h2>
      </div>
    `
  }
};

/* OPEN APP */
function openApp(id) {
  const app = APPS[id];
  if (!app) return;

  if (openWins.has(id)) {
    const existing = openWins.get(id);
    existing.classList.remove("minimized");
    bringToFront(existing);
    return;
  }

  const win = document.createElement("div");
  win.className = "os-win";
  win.dataset.title = app.title;

  win.innerHTML = `
    <div class="os-win-header">
      <div class="traffic">
        <button
          class="t-close"
          onclick="closeApp('${id}')"
        ></button>

        <button
          class="t-min"
          onclick="this.closest('.os-win').classList.add('minimized')"
        ></button>

        <button class="t-max"></button>
      </div>

      <div class="os-win-title">
        ${app.title}
      </div>
    </div>

    <div class="os-win-body" style="flex-direction: column;">
      ${app.render()}
    </div>
  `;

  winLayer.appendChild(win);
  openWins.set(id, win);

  bringToFront(win);

  document.querySelectorAll(".dock-item").forEach(item => {
    const click = item.getAttribute("onclick") || "";

    if (click.includes(id)) {
      item.classList.add("running");
    }
  });

  win.addEventListener("mousedown", () => {
    bringToFront(win);
  });

  if (app.wire) {
    setTimeout(() => app.wire(win), 50);
  }
}
</script>
