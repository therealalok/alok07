<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alok Sharma — Portfolio OS</title>
<link rel="icon" href="nayalogo.png?v=3" type="image/png" sizes="32x32">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
:root {
  --bg-color: #000;
  --text-primary: #ffffff;
  --text-secondary: #cccccc;
  --text-muted: #888888;
  --accent: #0078D4;
  --accent-hover: #005A9E;
  
  --acrylic-light: rgba(255, 255, 255, 0.03);
  --acrylic-base: rgba(30, 30, 30, 0.65);
  --acrylic-heavy: rgba(20, 20, 20, 0.85);
  
  --border-light: rgba(255, 255, 255, 0.08);
  --border-active: rgba(255, 255, 255, 0.15);
  
  --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
  
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  
  --font-ui: 'Segoe UI', 'Inter', sans-serif;
  --transition-fast: 0.15s ease;
  --transition-smooth: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}

[data-theme="light"] {
  --text-primary: #111111;
  --text-secondary: #444444;
  --text-muted: #666666;
  --acrylic-base: rgba(243, 243, 243, 0.75);
  --acrylic-heavy: rgba(255, 255, 255, 0.9);
  --border-light: rgba(0, 0, 0, 0.1);
  --border-active: rgba(0, 0, 0, 0.2);
}

* { margin:0; padding:0; box-sizing:border-box; user-select: none; }
html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg-color); font-family: var(--font-ui); color: var(--text-primary); }
button, input { font-family: inherit; color: inherit; outline: none; border: none; background: none; }
img { user-drag: none; -webkit-user-drag: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(150,150,150,0.3); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(150,150,150,0.5); }

/* Wallpaper */
#wallpaper {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(circle at 50% 120%, #004e92 0%, #000428 80%);
  background-size: cover; background-position: center; transition: background 0.5s;
}

/* Desktop & Icons */
#desktop { position: absolute; inset: 0; bottom: 48px; z-index: 10; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; padding: 10px; gap: 4px; }
.desktop-icon { width: 74px; height: 85px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 6px; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid transparent; }
.desktop-icon:hover { background: rgba(255,255,255,0.06); }
.desktop-icon.selected { background: rgba(255,255,255,0.1); border-color: var(--border-light); }
.desktop-icon img, .desktop-icon i { width: 40px; height: 40px; font-size: 38px; margin-bottom: 6px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); color: #60CDFF; }
.desktop-icon span { font-size: 11px; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.8); line-height: 1.2; word-break: break-word; color: #fff; }

/* Selection Box */
#selection-box { position: fixed; border: 1px solid var(--accent); background: rgba(0, 120, 212, 0.3); z-index: 9; display: none; pointer-events: none; }

/* Windows Container */
#windows-layer { position: absolute; inset: 0; bottom: 48px; z-index: 20; pointer-events: none; }

/* Window Styles */
.win-os {
  position: absolute; top: 10%; left: 15%; width: 800px; height: 550px;
  background: var(--acrylic-base); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
  border: 1px solid var(--border-light); border-radius: var(--radius-md); box-shadow: var(--shadow-md);
  display: flex; flex-direction: column; overflow: hidden; pointer-events: auto; opacity: 0; transform: scale(0.95);
  transition: transform 0.15s ease, opacity 0.15s ease, width 0.2s, height 0.2s, top 0.2s, left 0.2s;
}
.win-os.active-win { opacity: 1; transform: scale(1); box-shadow: var(--shadow-lg); border-color: var(--border-active); }
.win-os.maximized { top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; }
.win-os.minimized { opacity: 0; transform: scale(0.8) translateY(100px); pointer-events: none; }

/* Title Bar */
.win-titlebar { height: 36px; display: flex; justify-content: space-between; align-items: center; padding-left: 12px; flex-shrink: 0; cursor: default; }
.win-titlebar.draggable { cursor: grab; }
.win-titlebar.draggable:active { cursor: grabbing; }
.win-title { font-size: 12px; display: flex; align-items: center; gap: 8px; opacity: 0.8; font-weight: 500; }
.win-title i { font-size: 14px; }
.win-controls { display: flex; height: 100%; }
.win-btn { width: 46px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: background 0.1s; cursor: pointer; }
.win-btn:hover { background: rgba(255,255,255,0.1); }
.win-btn.close:hover { background: #E81123; color: white; }

/* App Content Area */
.win-content { flex: 1; display: flex; background: var(--bg-color); position: relative; overflow: hidden; }

/* File Explorer Specifics */
.explorer-layout { display: flex; width: 100%; height: 100%; flex-direction: column; }
.explorer-toolbar { height: 48px; background: var(--acrylic-light); display: flex; align-items: center; padding: 0 12px; gap: 16px; border-bottom: 1px solid var(--border-light); }
.explorer-nav-btns { display: flex; gap: 8px; }
.explorer-nav-btns button { width: 32px; height: 32px; border-radius: 4px; cursor: pointer; }
.explorer-nav-btns button:hover { background: rgba(255,255,255,0.1); }
.explorer-address { flex: 1; height: 32px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-light); border-radius: 4px; display: flex; align-items: center; padding: 0 12px; font-size: 12px; gap: 8px; color: var(--text-secondary); }
.explorer-search { width: 200px; height: 32px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-light); border-radius: 4px; padding: 0 12px; font-size: 12px; display: flex; align-items: center; justify-content: space-between; }
.explorer-search input { width: 100%; background: transparent; color: inherit; }
.explorer-body { display: flex; flex: 1; overflow: hidden; }
.explorer-sidebar { width: 220px; background: var(--acrylic-light); border-right: 1px solid var(--border-light); overflow-y: auto; padding: 12px; }
.explorer-main { flex: 1; overflow-y: auto; padding: 16px; background: var(--bg-color); }
.tree-item { padding: 6px 10px; display: flex; align-items: center; gap: 10px; border-radius: 4px; cursor: pointer; font-size: 13px; margin-bottom: 2px; }
.tree-item:hover { background: rgba(255,255,255,0.06); }
.tree-item.active { background: rgba(255,255,255,0.1); color: var(--accent); border-left: 3px solid var(--accent); }
.file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 16px; }
.file-item { display: flex; flex-direction: column; align-items: center; padding: 8px; border-radius: 4px; cursor: pointer; text-align: center; border: 1px solid transparent; }
.file-item:hover { background: rgba(255,255,255,0.06); }
.file-item.selected { background: rgba(255,255,255,0.1); border-color: var(--border-light); }
.file-item img { width: 64px; height: 64px; object-fit: cover; border-radius: 4px; margin-bottom: 8px; }
.file-item .file-icon { width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #60CDFF; margin-bottom: 8px; }
.file-item span { font-size: 12px; word-break: break-word; line-height: 1.3; }

/* Native-looking Spotify App Wrapper */
.spotify-native-wrapper { display: flex; width: 100%; height: 100%; background: linear-gradient(to bottom right, #121212, #000); flex-direction: column; }
.sp-header { padding: 20px; background: rgba(255,255,255,0.02); display: flex; gap: 20px; align-items: flex-end; border-bottom: 1px solid rgba(255,255,255,0.05); }
.sp-header img { width: 140px; height: 140px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.sp-info h1 { font-size: 42px; font-weight: 700; margin-bottom: 8px; }
.sp-info p { color: var(--text-muted); font-size: 13px; }
.sp-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
.sp-embed-container { width: 100%; max-width: 600px; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 16px; box-shadow: inset 0 1px 2px rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.05); }

/* Text Content Apps (About, Education, Settings) */
.standard-app { padding: 40px; max-width: 800px; margin: 0 auto; overflow-y: auto; width: 100%; height: 100%; user-select: text; }
.standard-app h1 { font-size: 32px; font-weight: 600; margin-bottom: 24px; }
.standard-app p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
.info-section { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-light); }
.info-section h3 { font-size: 16px; margin-bottom: 8px; font-weight: 600; }
.contact-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 20px; }
.contact-item { display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: var(--acrylic-light); border: 1px solid var(--border-light); border-radius: 8px; font-size: 14px; }
.contact-item i { font-size: 20px; color: var(--accent); width: 24px; text-align: center; }

/* Taskbar */
#taskbar {
  position: fixed; bottom: 0; left: 0; right: 0; height: 48px; z-index: 1000;
  background: var(--acrylic-heavy); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  border-top: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; padding: 0 12px;
}
.tb-center { display: flex; gap: 4px; height: 100%; align-items: center; position: absolute; left: 50%; transform: translateX(-50%); }
.tb-icon {
  width: 40px; height: 40px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative; transition: all 0.15s; font-size: 20px; color: var(--text-primary);
}
.tb-icon:hover { background: rgba(255,255,255,0.1); }
.tb-icon img { width: 24px; height: 24px; }
.tb-icon.active::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 16px; height: 3px; background: var(--accent); border-radius: 2px; }
.tb-icon.running:not(.active)::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 6px; height: 3px; background: var(--text-muted); border-radius: 2px; }
#start-btn { color: #0078D4; font-size: 22px; }
#start-btn:hover { background: rgba(255,255,255,0.15); }

.tb-right { display: flex; gap: 4px; height: 100%; align-items: center; margin-left: auto; }
.tb-tray-item { padding: 0 10px; height: 36px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; transition: background 0.15s; }
.tb-tray-item:hover { background: rgba(255,255,255,0.1); }
.tb-clock { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; line-height: 1.2; font-size: 12px; }

/* Start Menu */
#start-menu {
  position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(20px); width: 600px; height: 650px;
  background: var(--acrylic-heavy); backdrop-filter: blur(40px); border: 1px solid var(--border-light);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); z-index: 999; display: flex; flex-direction: column;
  opacity: 0; pointer-events: none; transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
#start-menu.open { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.start-search { padding: 24px; }
.start-search input { width: 100%; height: 40px; background: rgba(0,0,0,0.4); border: 1px solid var(--border-light); border-radius: 20px; padding: 0 20px; font-size: 14px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
.start-pinned { flex: 1; padding: 0 32px; }
.start-section-title { font-size: 13px; font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; }
.start-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
.start-app { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; padding: 12px 8px; border-radius: var(--radius-sm); }
.start-app:hover { background: rgba(255,255,255,0.08); }
.start-app i, .start-app img { font-size: 32px; width: 32px; height: 32px; color: #60CDFF; }
.start-app span { font-size: 12px; }
.start-bottom { height: 64px; background: rgba(0,0,0,0.2); border-top: 1px solid var(--border-light); border-bottom-left-radius: var(--radius-lg); border-bottom-right-radius: var(--radius-lg); display: flex; justify-content: space-between; align-items: center; padding: 0 32px; }
.start-user { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 600; }
.start-user img { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); }
.power-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; transition: background 0.15s; }
.power-btn:hover { background: rgba(255,255,255,0.1); }
.power-menu { position: absolute; bottom: 70px; right: 20px; background: var(--acrylic-base); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 8px; display: none; flex-direction: column; min-width: 150px; box-shadow: var(--shadow-md); backdrop-filter: blur(20px); }
.power-menu.show { display: flex; }
.pm-item { padding: 10px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-radius: var(--radius-sm); font-size: 13px; }
.pm-item:hover { background: rgba(255,255,255,0.1); }

/* Action Center (Settings) */
#action-center {
  position: fixed; bottom: 60px; right: 12px; width: 360px; background: var(--acrylic-heavy);
  backdrop-filter: blur(40px); border: 1px solid var(--border-light); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); z-index: 999; display: flex; flex-direction: column; padding: 20px;
  opacity: 0; pointer-events: none; transform: translateY(20px); transition: all 0.2s;
}
#action-center.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
.ac-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.ac-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border-light); border-radius: var(--radius-sm); padding: 16px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: background 0.15s; font-size: 12px; }
.ac-btn:hover { background: rgba(255,255,255,0.1); }
.ac-btn.active { background: var(--accent); border-color: var(--accent); }
.ac-btn i { font-size: 20px; }
.ac-slider-group { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.ac-slider-group i { font-size: 16px; width: 20px; text-align: center; color: var(--text-secondary); }
.ac-slider { flex: 1; -webkit-appearance: none; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; outline: none; }
.ac-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 4px solid #fff; }

/* Context Menu */
#context-menu { position: fixed; background: var(--acrylic-base); border: 1px solid var(--border-light); backdrop-filter: blur(25px); border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: 4px; display: none; flex-direction: column; min-width: 200px; z-index: 10000; }
.cm-item { padding: 8px 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-radius: var(--radius-sm); font-size: 12px; }
.cm-item:hover { background: rgba(255,255,255,0.1); }
.cm-divider { height: 1px; background: var(--border-light); margin: 4px 0; }

/* System Overlays */
.sys-overlay { position: fixed; inset: 0; z-index: 20000; display: none; align-items: center; justify-content: center; flex-direction: column; background: var(--bg-color); color: #fff; }
.sys-overlay.active { display: flex; }
#lock-screen { background: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070') center/cover; }
#lock-screen::before { content:''; position:absolute; inset:0; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
.lock-content { position: relative; z-index: 1; text-align: center; }
.lock-time { font-size: 96px; font-weight: 600; margin-bottom: 10px; }
.lock-date { font-size: 24px; font-weight: 400; margin-bottom: 60px; }
.lock-user { width: 120px; height: 120px; border-radius: 50%; background: var(--accent); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 48px; }
.lock-btn { padding: 12px 32px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); border-radius: 24px; cursor: pointer; font-size: 16px; font-weight: 600; transition: background 0.2s; backdrop-filter: blur(5px); }
.lock-btn:hover { background: rgba(255,255,255,0.3); }

/* ImageViewer */
.img-viewer { background: rgba(0,0,0,0.9) !important; align-items: center; justify-content: center; padding: 20px; }
.img-viewer img { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }

</style>
</head>
<body>

<div id="wallpaper"></div>
<div id="desktop"></div>
<div id="selection-box"></div>
<div id="windows-layer"></div>

<div id="taskbar">
  <div class="tb-left"></div>
  <div class="tb-center" id="tb-apps">
    <div class="tb-icon" id="start-btn" onclick="toggleStartMenu()"><i class="fa-brands fa-windows"></i></div>
    <div class="tb-icon" onclick="openApp('explorer')" title="File Explorer"><i class="fa-solid fa-folder-open" style="color:#F3C144;"></i></div>
    <div class="tb-icon" onclick="openApp('about')" title="About Me"><i class="fa-solid fa-user" style="color:#0078D4;"></i></div>
    <div class="tb-icon" onclick="openApp('spotify')" title="Media Player"><i class="fa-solid fa-music" style="color:#1DB954;"></i></div>
  </div>
  <div class="tb-right">
    <div class="tb-tray-item" onclick="toggleActionCenter()">
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-volume-high"></i>
      <i class="fa-solid fa-battery-full"></i>
    </div>
    <div class="tb-tray-item tb-clock" id="taskbar-clock" onclick="toggleActionCenter()">
      <span id="tb-time">12:00 AM</span>
      <span id="tb-date">1/1/2026</span>
    </div>
  </div>
</div>

<div id="start-menu">
  <div class="start-search"><input type="text" placeholder="Type here to search"></div>
  <div class="start-pinned">
    <div class="start-section-title"><span>Pinned</span><button style="background:rgba(255,255,255,0.1); padding:2px 8px; border-radius:4px; font-size:11px;">All apps ></button></div>
    <div class="start-grid" id="start-grid-apps">
      <!-- Injected by JS -->
    </div>
  </div>
  <div class="start-bottom">
    <div class="start-user"><div style="width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-user"></i></div> Alok Sharma</div>
    <div style="position:relative;">
      <div class="power-btn" onclick="togglePowerMenu()"><i class="fa-solid fa-power-off"></i></div>
      <div class="power-menu" id="power-menu">
        <div class="pm-item" onclick="systemAction('sleep')"><i class="fa-solid fa-moon"></i> Sleep</div>
        <div class="pm-item" onclick="systemAction('shutdown')"><i class="fa-solid fa-power-off"></i> Shut down</div>
        <div class="pm-item" onclick="systemAction('restart')"><i class="fa-solid fa-rotate-right"></i> Restart</div>
        <div class="cm-divider"></div>
        <div class="pm-item" onclick="systemAction('lock')"><i class="fa-solid fa-lock"></i> Lock</div>
      </div>
    </div>
  </div>
</div>

<div id="action-center">
  <div class="ac-grid">
    <div class="ac-btn active" onclick="this.classList.toggle('active')"><i class="fa-solid fa-wifi"></i> Wi-Fi</div>
    <div class="ac-btn active" onclick="this.classList.toggle('active')"><i class="fa-brands fa-bluetooth-b"></i> Bluetooth</div>
    <div class="ac-btn" onclick="toggleTheme(this)"><i class="fa-solid fa-moon"></i> Theme</div>
  </div>
  <div class="ac-slider-group"><i class="fa-solid fa-sun"></i><input type="range" class="ac-slider" value="80"></div>
  <div class="ac-slider-group"><i class="fa-solid fa-volume-high"></i><input type="range" class="ac-slider" value="50"></div>
</div>

<div id="context-menu">
  <div class="cm-item" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i> Refresh</div>
  <div class="cm-divider"></div>
  <div class="cm-item" onclick="openApp('settings')"><i class="fa-solid fa-display"></i> Display settings</div>
  <div class="cm-item" onclick="openApp('settings')"><i class="fa-solid fa-palette"></i> Personalize</div>
  <div class="cm-divider"></div>
  <div class="cm-item" onclick="emptyRecycleBin()"><i class="fa-solid fa-trash"></i> Empty Recycle Bin</div>
</div>

<div class="sys-overlay" id="lock-screen">
  <div class="lock-content">
    <div class="lock-time" id="ls-time">12:00</div>
    <div class="lock-date" id="ls-date">Monday, January 1</div>
    <div class="lock-user"><i class="fa-solid fa-user"></i></div>
    <h2 style="margin-bottom:24px; font-weight:600;">Alok Sharma</h2>
    <button class="lock-btn" onclick="document.getElementById('lock-screen').classList.remove('active')">Sign in</button>
  </div>
</div>

/* --- STATE & INITIALIZATION --- */
let zIndexCounter = 100;
const openWindows = new Map();
const desktopIcons = [
  { id: 'explorer', title: 'Projects', icon: 'fa-folder-open', color: '#F3C144' },
  { id: 'about', title: 'About Me', icon: 'fa-user', color: '#0078D4' },
  { id: 'education', title: 'Education', icon: 'fa-graduation-cap', color: '#E81123' },
  { id: 'skills', title: 'Skills', icon: 'fa-code', color: '#107C41' },
  { id: 'contact', title: 'Contact', icon: 'fa-envelope', color: '#D83B01' },
  { id: 'recycle', title: 'Recycle Bin', icon: 'fa-trash', color: '#cccccc' }
];

function init() {
  renderDesktop();
  renderStartMenu();
  updateClock();
  setInterval(updateClock, 1000);
  applySavedTheme();
}

function renderDesktop() {
  const desktop = document.getElementById('desktop');
  desktop.innerHTML = desktopIcons.map(item => `
    <div class="desktop-icon" ondblclick="openApp('${item.id}')" onclick="selectDesktopIcon(this, event)">
      <i class="fa-solid ${item.icon}" style="color:${item.color}"></i>
      <span>${item.title}</span>
    </div>
  `).join('');
}

function renderStartMenu() {
  const grid = document.getElementById('start-grid-apps');
  grid.innerHTML = Object.keys(APPS).map(key => `
    <div class="start-app" onclick="openApp('${key}'); toggleStartMenu();">
      <i class="fa-solid ${APPS[key].icon}" style="color:${APPS[key].color}"></i>
      <span>${APPS[key].title}</span>
    </div>
  `).join('');
}

/* --- WINDOW MANAGEMENT --- */
function openApp(id) {
  if (openWindows.has(id)) {
    let win = openWindows.get(id);
    if (win.classList.contains('minimized')) win.classList.remove('minimized');
    focusWindow(win);
    updateTaskbarIndicators();
    return;
  }

  const app = APPS[id];
  if(!app) return;

  const win = document.createElement('div');
  win.className = 'win-os';
  win.id = `win-${id}`;
  
  win.innerHTML = `
    <div class="win-titlebar draggable" onmousedown="focusWindow(this.parentElement)">
      <div class="win-title"><i class="fa-solid ${app.icon}" style="color:${app.color}"></i> ${app.title}</div>
      <div class="win-controls">
        <div class="win-btn" onclick="minimizeWindow('${id}')"><i class="fa-solid fa-minus"></i></div>
        <div class="win-btn" onclick="maximizeWindow('${id}')"><i class="fa-regular fa-square"></i></div>
        <div class="win-btn close" onclick="closeApp('${id}')"><i class="fa-solid fa-xmark"></i></div>
      </div>
    </div>
    <div class="win-content">${app.render()}</div>
  `;

  document.getElementById('windows-layer').appendChild(win);
  openWindows.set(id, win);
  
  // Offset slight cascade for new windows
  const offset = (openWindows.size * 20) % 100;
  win.style.top = `${10 + offset}%`;
  win.style.left = `${15 + offset}%`;

  setTimeout(() => { win.classList.add('active-win'); }, 10);
  focusWindow(win);
  makeDraggable(win, win.querySelector('.win-titlebar'));
  addToTaskbar(id);
}

function closeApp(id) {
  const win = openWindows.get(id);
  if (win) {
    win.style.opacity = '0';
    win.style.transform = 'scale(0.95)';
    setTimeout(() => { win.remove(); openWindows.delete(id); updateTaskbarIndicators(); }, 150);
  }
}

function minimizeWindow(id) {
  const win = openWindows.get(id);
  if (win) { win.classList.add('minimized'); win.classList.remove('active-win'); updateTaskbarIndicators(); }
}

function maximizeWindow(id) {
  const win = openWindows.get(id);
  if (win) {
    win.classList.toggle('maximized');
    win.querySelector('.fa-square').className = win.classList.contains('maximized') ? 'fa-regular fa-clone' : 'fa-regular fa-square';
  }
}

function focusWindow(win) {
  zIndexCounter++;
  win.style.zIndex = zIndexCounter;
  document.querySelectorAll('.win-os').forEach(w => w.classList.remove('active-win'));
  win.classList.add('active-win');
  updateTaskbarIndicators();
}

function addToTaskbar(id) {
  if (document.getElementById(`tb-${id}`)) return;
  const app = APPS[id];
  const tb = document.getElementById('tb-apps');
  const icon = document.createElement('div');
  icon.className = 'tb-icon running active';
  icon.id = `tb-${id}`;
  icon.title = app.title;
  icon.innerHTML = `<i class="fa-solid ${app.icon}" style="color:${app.color}"></i>`;
  icon.onclick = () => {
    const win = openWindows.get(id);
    if (win.classList.contains('minimized')) { win.classList.remove('minimized'); focusWindow(win); }
    else if (win.classList.contains('active-win')) { minimizeWindow(id); }
    else { focusWindow(win); }
  };
  tb.appendChild(icon);
  updateTaskbarIndicators();
}

function updateTaskbarIndicators() {
  document.querySelectorAll('.tb-icon.running').forEach(icon => {
    const id = icon.id.replace('tb-', '');
    const win = openWindows.get(id);
    if (!win) { icon.remove(); return; }
    if (win.classList.contains('active-win') && !win.classList.contains('minimized')) {
      icon.classList.add('active');
    } else {
      icon.classList.remove('active');
    }
  });
}

/* --- DRAG & DROP / RESIZE --- */
function makeDraggable(el, header) {
  let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
  header.onmousedown = dragMouseDown;

  function dragMouseDown(e) {
    if(el.classList.contains('maximized') || e.target.closest('.win-controls')) return;
    e.preventDefault();
    pos3 = e.clientX; pos4 = e.clientY;
    document.onmouseup = closeDragElement;
    document.onmousemove = elementDrag;
  }

  function elementDrag(e) {
    e.preventDefault();
    pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
    pos3 = e.clientX; pos4 = e.clientY;
    el.style.top = Math.max(0, (el.offsetTop - pos2)) + "px";
    el.style.left = (el.offsetLeft - pos1) + "px";
    
    // Snap to top to maximize
    if (e.clientY <= 0 && !el.classList.contains('maximized')) { maximizeWindow(el.id.replace('win-','')); closeDragElement(); }
  }
  function closeDragElement() { document.onmouseup = null; document.onmousemove = null; }
}

/* --- EXPLORER LOGIC --- */
function renderFolderGrid(files) {
  return `<div class="file-grid">` + files.map(f => `
    <div class="file-item" onclick="openImageViewer('${f.title}')">
      <i class="fa-regular ${f.icon} file-icon"></i>
      <span>${f.title}</span>
    </div>
  `).join('') + `</div>`;
}

function loadFolder(folder, el) {
  document.querySelectorAll('.tree-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('explorer-main-view').innerHTML = renderFolderGrid(PROJECTS[folder]);
  document.querySelector('.explorer-address').innerHTML = `<i class="fa-solid fa-folder-open" style="color:#F3C144"></i> This PC > Projects > ${folder}`;
}

let ivCount = 0;
function openImageViewer(title) {
  ivCount++;
  const id = 'img-view-' + ivCount;
  APPS[id] = {
    title: title, icon: "fa-image", color: "#31A8FF",
    render: () => `<div class="win-content img-viewer"><img src="${title}" alt="${title}"></div>`
  };
  openApp(id);
}

/* --- DESKTOP SELECTION & CONTEXT MENU --- */
let isSelecting = false, startX, startY;
const sBox = document.getElementById('selection-box');
const desktop = document.getElementById('desktop');

desktop.addEventListener('mousedown', e => {
  if (e.target !== desktop) return;
  if(e.button === 2) return; // Right click
  document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
  isSelecting = true;
  startX = e.clientX; startY = e.clientY;
  sBox.style.display = 'block';
  sBox.style.left = startX + 'px';
  sBox.style.top = startY + 'px';
  sBox.style.width = '0px';
  sBox.style.height = '0px';
  closeMenus();
});

document.addEventListener('mousemove', e => {
  if (!isSelecting) return;
  const currentX = e.clientX, currentY = e.clientY;
  const w = Math.abs(currentX - startX), h = Math.abs(currentY - startY);
  sBox.style.width = w + 'px'; sBox.style.height = h + 'px';
  sBox.style.left = (currentX < startX ? currentX : startX) + 'px';
  sBox.style.top = (currentY < startY ? currentY : startY) + 'px';
});

document.addEventListener('mouseup', () => {
  isSelecting = false;
  sBox.style.display = 'none';
});

function selectDesktopIcon(el, e) {
  e.stopPropagation();
  if(!e.ctrlKey) document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
  el.classList.add('selected');
  closeMenus();
}

desktop.addEventListener('contextmenu', e => {
  e.preventDefault();
  const cm = document.getElementById('context-menu');
  cm.style.display = 'flex';
  cm.style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px';
  cm.style.top = Math.min(e.clientY, window.innerHeight - 150) + 'px';
  closeMenus('context');
});

document.addEventListener('click', e => {
  if(!e.target.closest('#context-menu') && e.button !== 2) {
    document.getElementById('context-menu').style.display = 'none';
  }
});

/* --- SYSTEM MENUS & TIME --- */
function toggleStartMenu() {
  const sm = document.getElementById('start-menu');
  sm.classList.toggle('open');
  document.getElementById('action-center').classList.remove('open');
  document.getElementById('power-menu').classList.remove('show');
}

function toggleActionCenter() {
  document.getElementById('action-center').classList.toggle('open');
  document.getElementById('start-menu').classList.remove('open');
}

function togglePowerMenu() { document.getElementById('power-menu').classList.toggle('show'); }

function closeMenus(except) {
  if(except !== 'start') document.getElementById('start-menu').classList.remove('open');
  if(except !== 'action') document.getElementById('action-center').classList.remove('open');
  if(except !== 'power') document.getElementById('power-menu').classList.remove('show');
  if(except !== 'context') document.getElementById('context-menu').style.display = 'none';
}

function updateClock() {
  const d = new Date();
  document.getElementById('tb-time').innerText = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  document.getElementById('tb-date').innerText = d.toLocaleDateString();
  document.getElementById('ls-time').innerText = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  document.getElementById('ls-date').innerText = d.toLocaleDateString([], {weekday: 'long', month: 'long', day: 'numeric'});
}

/* --- SYSTEM POWER ACTIONS --- */
function systemAction(action) {
  closeMenus();
  if (action === 'sleep') {
    document.getElementById('black-screen').classList.add('active');
  } else if (action === 'wake') {
    document.getElementById('black-screen').classList.remove('active');
  } else if (action === 'lock') {
    document.getElementById('lock-screen').classList.add('active');
  } else if (action === 'shutdown') {
    document.getElementById('shutdown-screen').classList.add('active');
    setTimeout(() => {
      try { window.close(); } catch(e) {}
      document.getElementById('shutdown-screen').innerHTML = '<div style="font-size:20px; color:#555;">It is now safe to close your browser tab.</div>';
    }, 2500);
  } else if (action === 'restart') {
    document.getElementById('shutdown-screen').classList.add('active');
    document.getElementById('shutdown-screen').querySelector('div').innerText = "Restarting...";
    setTimeout(() => { location.reload(); }, 2000);
  }
}

/* --- SETTINGS & THEME --- */
function setTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
  localStorage.setItem('win-theme', mode);
}

function toggleTheme(btn) {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  setTheme(isLight ? 'dark' : 'light');
  btn.classList.toggle('active', isLight);
}

function applySavedTheme() {
  const saved = localStorage.getItem('win-theme');
  if (saved) setTheme(saved);
}

function emptyRecycleBin() {
  const icon = document.querySelector('.desktop-icon i.fa-trash');
  if(icon) {
    icon.classList.remove('fa-trash');
    icon.classList.add('fa-trash-can');
  }
  document.getElementById('context-menu').style.display = 'none';
}

window.onload = init;
